<title>Simulacro Inspector</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una hoja de respuestas de examen — columna central, burbujas tipo planilla óptica, corrección en rojo/verde */
:root{
  --paper:#F3F4EF; --sheet:#FFFFFF; --ink:#18212E; --muted:#5A6372; --rule:#D8DCD2; --rule-strong:#B9BFB3;
  --accent:#2245A6; --accent-soft:#E3E9F8; --ok:#1C7443; --ok-soft:#E1F1E7; --bad:#B0261C; --bad-soft:#F8E3E0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151B; --sheet:#181E27; --ink:#E7EAEF; --muted:#9AA3B1; --rule:#28303C; --rule-strong:#3A4452;
  --accent:#8CA8FF; --accent-soft:#1E2A47; --ok:#55C98D; --ok-soft:#173226; --bad:#FF8478; --bad-soft:#3A1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151B; --sheet:#181E27; --ink:#E7EAEF; --muted:#9AA3B1; --rule:#28303C; --rule-strong:#3A4452;
  --accent:#8CA8FF; --accent-soft:#1E2A47; --ok:#55C98D; --ok-soft:#173226; --bad:#FF8478; --bad-soft:#3A1C1A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 32px;background-attachment:fixed}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px double var(--rule-strong);padding-bottom:10px}
.mast h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,44px);line-height:.95;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.mast .sub{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.mast .meta{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}

.sheet{background:var(--sheet);border:1px solid var(--rule-strong);border-radius:4px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:16px}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
p{margin:0}
.lead{font-family:var(--body);font-size:16px;color:var(--ink);max-width:62ch}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--rule-strong);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

.modlist{display:flex;flex-direction:column}
.modrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--rule)}
.modrow:first-child{border-top:0}
.modrow .code{font-family:var(--mono);font-size:12px;color:var(--muted);width:2.4em}
.modrow .name{min-width:0;font-weight:600;line-height:1.3}
.modrow .name small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);font-size:18px;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{font-family:var(--mono);font-variant-numeric:tabular-nums;width:2ch;text-align:center;font-size:17px}
.radio-mod{width:22px;height:22px;accent-color:var(--accent)}

.totalbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:2px solid var(--ink)}
.total{font-family:var(--display);font-size:22px;font-weight:600;text-transform:uppercase}
.total b{font-family:var(--mono);font-weight:500}
.warn{color:var(--bad);font-size:13px}

.opts{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
select{font:inherit;padding:6px 8px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);border-radius:4px}

.btn{border:0;background:var(--accent);color:var(--sheet);padding:12px 20px;border-radius:4px;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule-strong)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:13.5px}

/* Pregunta */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.qnum{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.qnum span{font-family:var(--mono);font-size:14px;font-weight:400;color:var(--muted)}
.qmod{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:right}
.progress{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px}
.progress i{height:6px;border-radius:2px;background:var(--rule)}
.progress i.cur{background:var(--ink)}
.progress i.ans{background:var(--accent)}
.progress i.ok{background:var(--ok)}
.progress i.ko{background:var(--bad)}
.qtext{font-family:var(--body);font-size:clamp(17px,2.4vw,19.5px);line-height:1.45;font-weight:600;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.choice{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;width:100%;text-align:left;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;font-family:var(--body);font-size:16px;line-height:1.4}
.choice:hover:not(:disabled){border-color:var(--rule-strong);background:var(--paper)}
.choice .bub{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);transition:background .15s,border-color .15s}
.choice .txt{min-width:0;padding-top:3px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.choice:disabled{cursor:default}
.fb{border-left:4px solid var(--ok);padding:10px 14px;background:var(--ok-soft);border-radius:0 4px 4px 0;display:flex;flex-direction:column;gap:4px}
.fb.ko{border-color:var(--bad);background:var(--bad-soft)}
.fb strong{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.fb p{font-family:var(--body);font-size:15px}
.fb .src{font-family:var(--mono);font-size:12px;color:var(--muted)}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.kbd{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* Resultados */
.score{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-weight:700;font-size:clamp(64px,14vw,96px);line-height:.85;font-variant-numeric:tabular-nums}
.score .big small{font-size:.45em;color:var(--muted);font-weight:600}
.stamp{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.06em;border:3px solid currentColor;padding:4px 12px;border-radius:4px;transform:rotate(-3deg);display:inline-block}
.stamp.ok{color:var(--ok)}.stamp.mid{color:var(--accent)}.stamp.ko{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.bar .bn{font-size:13.5px;font-weight:600;min-width:0}
.bar .bv{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .track{grid-column:1/-1;height:10px;background:var(--rule);border-radius:2px;overflow:hidden}
.bar .fill{height:100%;background:var(--ok)}
.bar .fill.mid{background:var(--accent)}.bar .fill.lo{background:var(--bad)}
.review{display:flex;flex-direction:column;gap:12px}
.ritem{border-top:1px dashed var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.ritem .rq{font-family:var(--body);font-weight:600;font-size:15.5px}
.ritem .ra{font-size:14px}
.ritem .ra .x{color:var(--bad);text-decoration:line-through}
.ritem .ra .v{color:var(--ok);font-weight:600}
.ritem .re{font-family:var(--body);font-size:14px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.hist div{display:flex;justify-content:space-between;gap:10px;border-top:1px dotted var(--rule);padding:5px 0}
.foot{font-size:12px;color:var(--muted);text-align:center;max-width:60ch;margin:0 auto}
@media (max-width:480px){.mast .meta{text-align:left}.modrow{grid-template-columns:1fr auto}.modrow .code{display:none}.btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const MODULES = [{"id": "m1", "name": "Actualización legal, Código Penal y Narcomenudeo", "short": "Actualización legal y narcomenudeo"}, {"id": "m2", "name": "Conducción", "short": "Conducción"}, {"id": "m3", "name": "Seguridad de la Información", "short": "Seguridad de la información"}, {"id": "m4", "name": "Comunicación y Redacción", "short": "Comunicación y redacción"}, {"id": "m5", "name": "Legislación Policial – Sumario Administrativo", "short": "Legislación policial y sumario"}, {"id": "m6", "name": "Tiro", "short": "Tiro"}];
const BANK = [{"id": "m1a-0", "m": "m1", "q": "¿Qué ley nacional de 2005 modificó la Ley de Estupefacientes 23.737 y estableció la desfederalización parcial?", "o": ["Ley 26.052", "Ley 20.771", "Ley 14.239", "Ley 26.485"], "e": "El cambio principal fue la desfederalización de la competencia para investigar y juzgar determinadas conductas.", "p": 9}, {"id": "m1a-1", "m": "m1", "q": "¿Mediante qué ley provincial Santa Fe adhirió a la desfederalización parcial de la competencia penal en materia de estupefacientes (microtráfico)?", "o": ["Ley 14.239 (año 2023)", "Ley 12.521 (año 2006)", "Ley 14.228", "Ley 11.529"], "e": "En 2023 Santa Fe asumió la competencia para investigar y juzgar el microtráfico.", "p": 9}, {"id": "m1a-2", "m": "m1", "q": "Según la Constitución Nacional, la competencia federal en materia penal reviste el carácter de:", "o": ["Excepcional, expresa, inalterable e improrrogable", "General y prorrogable", "Supletoria de la provincial", "Concurrente en todos los casos"], "e": "Solo interviene en lo que las provincias expresamente delegaron a la Nación (art. 121 CN).", "p": 9}, {"id": "m1a-3", "m": "m1", "q": "Ante la duda sobre si un hecho es microtráfico provincial o narcotráfico federal, el personal debe:", "o": ["Dar inmediato aviso al Fiscal del MPA, sin perjuicio de realizar las diligencias urgentes de prevención", "Archivar las actuaciones", "Remitir directamente al juez federal sin avisar al MPA", "Liberar al detenido hasta que se defina"], "e": "El Fiscal articulará con la Justicia Federal según la Ley 26.052.", "p": 10}, {"id": "m1a-4", "m": "m1", "q": "Para que el comercio de estupefacientes (art. 5 inc. c y e) sea de competencia provincial, la droga debe estar:", "o": ["Fraccionada en dosis destinadas directamente al consumidor", "En cantidades mayores a 1 kg", "Acondicionada para exportación", "Sin fraccionar"], "e": "Se descarta la ausencia de fraccionamiento y las cadenas intermedias.", "p": 11}, {"id": "m1a-5", "m": "m1", "q": "¿Cuál de estos delitos NO está entre los desfederalizados por el art. 34 de la Ley 23.737?", "o": ["Transporte de estupefacientes", "Tenencia simple (art. 14)", "Falsificación de recetas médicas (art. 29)", "Suministro infiel de medicamentos (art. 204 CP)"], "e": "El transporte no está regulado entre los supuestos del art. 34.", "p": 10}, {"id": "m1a-6", "m": "m1", "q": "Según el principio de «Primacía Federal» (Ley 26.052, arts. 3 y 4), en caso de duda sobre la competencia:", "o": ["Prevalece la justicia federal", "Prevalece la justicia provincial", "Decide el fiscal provincial", "Se archiva la causa"], "e": "También prevalece la federal en casos de conexidad y mientras se resuelve una contienda de competencia.", "p": 11}, {"id": "m1a-7", "m": "m1", "q": "Existe conexidad SUBJETIVA cuando:", "o": ["A una persona se le imputa más de un delito en concurso real", "Varias personas cometen delitos reunidas", "Un delito se comete para facilitar otro", "El hecho ocurre en dos provincias"], "e": "Se deben unificar ante el fuero federal todas las causas por infracción a la Ley 23.737 de esa persona.", "p": 11}, {"id": "m1a-8", "m": "m1", "q": "Mientras se resuelve una contienda de competencia entre justicia provincial y federal, la investigación queda a cargo de:", "o": ["La justicia federal", "La justicia provincial", "El Ministerio de Seguridad", "La Corte Suprema provincial"], "e": "Hasta que el superior común (CSJN) resuelva.", "p": 12}, {"id": "m1a-9", "m": "m1", "q": "En los delitos de tenencia de estupefacientes, «tener» exige:", "o": ["Poder de disposición: tener la droga dentro de la esfera de custodia y ámbito de decisión", "Contacto físico directo con la sustancia", "Haberla comprado", "Haberla consumido"], "e": "Por eso se ha juzgado la tenencia «sin contacto» (ej. droga en el dormitorio del investigado).", "p": 13}, {"id": "m1a-10", "m": "m1", "q": "¿Qué artículo del Código Penal define el término «estupefacientes»?", "o": ["Art. 77", "Art. 14", "Art. 34", "Art. 5"], "e": "Comprende las sustancias susceptibles de producir dependencia física o psíquica incluidas en las listas del PEN (Decreto 560/19).", "p": 13}, {"id": "m1a-11", "m": "m1", "q": "La pena de la tenencia simple de estupefacientes (art. 14, 1° párrafo, Ley 23.737) es de:", "o": ["1 a 6 años de prisión y multa", "1 mes a 2 años de prisión", "4 a 15 años de prisión", "6 meses a 3 años"], "e": "La tenencia para consumo personal (2° párrafo) tiene pena de 1 mes a 2 años.", "p": 13}, {"id": "m1a-12", "m": "m1", "q": "La tenencia simple es una figura de peligro abstracto cuyo bien jurídico protegido es:", "o": ["La salud pública", "La propiedad", "La seguridad de la Nación", "La administración pública"], "e": "Genera un riesgo potencial para la salud pública.", "p": 14}, {"id": "m1a-13", "m": "m1", "q": "Cuando no se ha comprobado ni la finalidad de comercio ni la de consumo personal, corresponde aplicar:", "o": ["La tenencia simple (art. 14, 1° párrafo), figura residual", "La tenencia para consumo personal", "La tenencia con fines de comercialización", "El archivo obligatorio"], "e": "La tenencia simple es una figura básica de carácter residual.", "p": 14}, {"id": "m1a-14", "m": "m1", "q": "¿Qué fallo de la CSJN de 2009 declaró inconstitucional el art. 14, 2° párrafo de la Ley 23.737 cuando la tenencia para consumo no genera peligro concreto a terceros?", "o": ["Arriola", "Bazterrica", "Montalvo", "Colavini"], "e": "Colavini (1978) y Montalvo (1990) sostuvieron la sanción; Bazterrica (1986) despenalizó.", "p": 15}, {"id": "m1a-15", "m": "m1", "q": "Pese al fallo «Arriola», ante el hallazgo de estupefacientes para consumo personal el personal policial debe:", "o": ["Disponer su secuestro e identificación, porque sigue siendo delito de acción pública", "No intervenir, porque está despenalizado", "Destruir la sustancia en el lugar", "Labrar solo un acta contravencional"], "e": "El art. 14, 2° párrafo sigue vigente; la inconstitucionalidad se analiza una vez judicializado el caso.", "p": 15}, {"id": "m1a-16", "m": "m1", "q": "La pena prevista para el comercio y la tenencia con fines de comercialización (art. 5 inc. c, Ley 23.737) es:", "o": ["4 a 15 años de prisión y multa", "1 a 6 años de prisión", "3 a 12 años de prisión", "1 mes a 2 años"], "e": "Ambas conductas tienen la misma pena.", "p": 16}, {"id": "m1a-17", "m": "m1", "q": "¿Qué es la «ultraintención» en la tenencia con fines de comercialización?", "o": ["La finalidad de comerciar, que debe acreditarse con otras circunstancias (balanzas, dinero, fraccionamiento, etc.)", "La intención de consumir la droga", "La cantidad de droga secuestrada", "La reincidencia del imputado"], "e": "Se demuestra con balanzas de precisión, dinero, anotaciones, envoltorios, tubos eppendorf, etc.", "p": 16}, {"id": "m1a-18", "m": "m1", "q": "La entrega, suministro o facilitación de estupefacientes a título GRATUITO (art. 5 inc. e) tiene pena de:", "o": ["3 a 12 años de prisión", "4 a 15 años de prisión", "1 a 6 años de prisión", "6 meses a 3 años"], "e": "A título oneroso, de 4 a 15 años. Si es ocasional, gratuita y para uso personal del receptor: 6 meses a 3 años.", "p": 18}, {"id": "m1a-19", "m": "m1", "q": "Si se descubre droga en la entrega a un interno dentro de un lugar de detención, ¿qué agravante corresponde?", "o": ["Art. 11 inc. e) de la Ley 23.737", "Art. 14 de la Ley 23.737", "Art. 29 de la Ley 23.737", "No hay agravante"], "e": "Agrava la pena cuando el delito se comete en establecimientos de enseñanza, centros asistenciales, lugares de detención, etc.", "p": 18}, {"id": "m1a-20", "m": "m1", "q": "La siembra o cultivo en escasa cantidad, destinada inequívocamente al consumo personal, tiene una pena de:", "o": ["1 mes a 2 años de prisión", "4 a 15 años de prisión", "3 a 12 años de prisión", "No tiene pena"], "e": "Art. 5°, penúltimo párrafo; si el destino es la fabricación, la pena es de 4 a 15 años.", "p": 19}, {"id": "m1a-21", "m": "m1", "q": "En el caso de las semillas, ¿qué resulta determinante establecer?", "o": ["Su capacidad germinativa", "Su color", "Su peso", "Su precio"], "e": "Las semillas no poseen el principio activo, por lo que carecen de calidad de estupefaciente para los delitos de tenencia.", "p": 19}, {"id": "m1a-22", "m": "m1", "q": "Según la jurisprudencia, el «almacenamiento» de estupefacientes es:", "o": ["Una tenencia agravada por la cantidad, significativa y acondicionada en un lugar especial", "Lo mismo que la tenencia para consumo", "Un delito que requiere fin de lucro", "Una contravención"], "e": "Es un delito de peligro abstracto que no requiere un propósito determinado.", "p": 22}, {"id": "m1a-23", "m": "m1", "q": "Para que se consume el delito de transporte de estupefacientes:", "o": ["Basta comprobar el traslado de la droga de un lugar a otro, sin importar distancia ni destino final", "La droga debe llegar a destino", "Debe acreditarse fin de comercialización", "Debe cruzar una frontera provincial"], "e": "Fallo «Vallejos» (CFCP, 2021).", "p": 22}, {"id": "m1a-24", "m": "m1", "q": "Según la Ley 14.239, ¿cuál es un criterio prioritario de persecución del microtráfico?", "o": ["Mercados abiertos en espacios públicos o con acceso público", "Tenencia para consumo personal en domicilio", "Cultivo para uso medicinal", "Entrega gratuita entre amigos"], "e": "También: búnkeres, uso de armas, participación de menores o vulnerables, alteración de la tranquilidad pública.", "p": 25}, {"id": "m1a-25", "m": "m1", "q": "Según la Ley 14.239, los casos no susceptibles de priorización (por ejemplo, sin tráfico oneroso o habitual) pueden:", "o": ["Ser archivados conforme al art. 21 del Código Procesal Penal", "Remitirse a la justicia federal", "Tramitarse como contravenciones", "Elevarse a juicio directamente"], "e": "Art. 4 de la Ley 14.239.", "p": 25}, {"id": "m1a-26", "m": "m1", "q": "Según el art. 30 de la Ley 23.737, las especies vegetales de cannabis, coca y amapola se destruyen por:", "o": ["Incineración", "Entierro", "Disolución química", "Trituración"], "e": "Previamente debe practicarse una pericia y conservar muestras.", "p": 25}, {"id": "m1b-0", "m": "m1", "q": "¿Qué artículo del Código Procesal Penal de Santa Fe define los supuestos de flagrancia?", "o": ["Art. 213 CPPSF", "Art. 101 CPPSF", "Art. 274 CPPSF", "Art. 21 CPPSF"], "e": "La aprehensión se rige por el art. 212 CPPSF cuando se trata de un delito de acción pública.", "p": 27}, {"id": "m1b-1", "m": "m1", "q": "¿Cuál de estos supuestos NO configura flagrancia según el art. 213 CPPSF?", "o": ["Que el autor sea identificado por la víctima una semana después en una rueda de reconocimiento", "Ser sorprendido al intentar o cometer el hecho", "Ser perseguido inmediatamente después de cometerlo", "Haberse fugado de un establecimiento penitenciario"], "e": "También: ser indicado por víctima/tercero en el momento y lugar, aparecer en un registro audiovisual inmediato o tener objetos/rastros que hagan presumir su participación.", "p": 27}, {"id": "m1b-2", "m": "m1", "q": "Según el Protocolo de Actuación en Flagrancia, las medidas realizadas deben consignarse en el acta de procedimiento dentro de:", "o": ["3 horas desde la aprehensión o desde la llegada al lugar", "24 horas", "1 hora", "48 horas"], "e": "Punto A.2 del protocolo.", "p": 27}, {"id": "m1b-3", "m": "m1", "q": "¿Cuántas fotografías panorámicas como mínimo deben tomarse del lugar del hecho según el protocolo?", "o": ["4", "2", "6", "10"], "e": "Desde una distancia que permita visualizar todo el escenario, más fotos específicas de objetos y rastros.", "p": 28}, {"id": "m1b-4", "m": "m1", "q": "El croquis ilustrativo del lugar del hecho debe ser:", "o": ["Un dibujo a mano alzada, esquemático, orientado, con leyenda, medidas reales y sin escala determinada", "Un plano a escala realizado por un arquitecto", "Una fotografía aérea", "Un dibujo sin medidas"], "e": "Debe reflejar puntos cardinales, calles, lugar de secuestro, aprehensión, víctima y cámaras.", "p": 28}, {"id": "m1b-5", "m": "m1", "q": "La inspección ocular debe constar:", "o": ["En un acta separada de la del procedimiento", "En la misma acta de procedimiento", "Solo en forma verbal", "En el croquis"], "e": "Incluye condiciones climáticas, visibilidad, accesos, trayecto de autores, lugar de aprehensión y secuestro.", "p": 28}, {"id": "m1b-6", "m": "m1", "q": "Las imágenes de cámaras privadas extraídas deben remitirse al MPA dentro de un plazo máximo de:", "o": ["48 horas", "24 horas", "72 horas", "7 días"], "e": "Como actuaciones complementarias con copia del acta de procedimiento.", "p": 29}, {"id": "m1b-7", "m": "m1", "q": "Al secuestrar un teléfono celular, el protocolo indica:", "o": ["No apagarlo y colocarlo en modo avión", "Apagarlo inmediatamente", "Retirarle la batería", "Revisar su contenido en el lugar"], "e": "Se debe detallar marca, modelo, color, IMEI y línea.", "p": 30}, {"id": "m1b-8", "m": "m1", "q": "Las armas de fuego secuestradas deben remitirse con cadena de custodia a:", "o": ["La Sección Balística de PDI", "El Departamento Logística (D-4)", "La Fiscalía Federal", "La armería de la comisaría"], "e": "Para determinar aptitud para el disparo, estado de conservación y restos de pólvora.", "p": 30}, {"id": "m1b-9", "m": "m1", "q": "Respecto de víctimas, testigos e imputados, el protocolo indica SIEMPRE:", "o": ["Evitar el contacto de la víctima o testigo con el imputado", "Hacer un careo inmediato en el lugar", "Trasladarlos juntos a la comisaría", "Permitir que la víctima hable con el imputado"], "e": "Para no frustrar eventuales medidas de investigación (ej. reconocimientos).", "p": 30}, {"id": "m1b-10", "m": "m1", "q": "El arresto con fines preventivos cuando no se puede determinar quiénes son testigos y quiénes participaron (art. 211 CPPSF) no puede exceder de:", "o": ["24 horas", "12 horas", "48 horas", "6 horas"], "e": "Puede consistir en no alejarse del lugar o no comunicarse entre sí antes de declarar.", "p": 31}, {"id": "m1b-11", "m": "m1", "q": "La comunicación de la aprehensión con la Fiscalía no puede exceder de:", "o": ["3 horas desde la aprehensión", "6 horas", "24 horas", "1 hora"], "e": "Salvo situación excepcional autorizada por el superior.", "p": 32}, {"id": "m1b-12", "m": "m1", "q": "¿Por qué medio debe comunicar la comisaría la aprehensión a la Fiscalía?", "o": ["El 0800-MPA", "El 911", "Correo electrónico al juez", "Radio policial"], "e": "Lo hace el personal de comisaría una vez recibidas las actuaciones, salvo hechos priorizados.", "p": 32}, {"id": "m1b-13", "m": "m1", "q": "Si el aprehendido no tiene DNI y no puede localizarse rápidamente, la comisaría debe:", "o": ["Realizar automáticamente un cotejo dactiloscópico", "Liberarlo", "Esperar 24 horas", "Pedir que un vecino lo identifique"], "e": "Si corresponde Dermotest, el cotejo dactiloscópico debe hacerse después.", "p": 32}, {"id": "m1b-14", "m": "m1", "q": "Ordenada la formación de causa, ¿cuántos juegos de fichas dactilares deben extraerse al imputado?", "o": ["Ocho", "Dos", "Cuatro", "Diez"], "e": "Bajo capacitación obligatoria de la Sección Dactiloscópica de PDI.", "p": 33}, {"id": "m1b-15", "m": "m1", "q": "Los derechos del imputado que deben informarse al ordenarse la formación de causa están en el:", "o": ["Art. 101 del CPPSF", "Art. 213 del CPPSF", "Art. 19 de la Constitución Nacional", "Art. 14 de la Ley 23.737"], "e": "Deben constar en acta individual firmada de puño y letra por el imputado.", "p": 32}, {"id": "m1b-16", "m": "m1", "q": "Para la constatación de domicilio del imputado, deben tomarse datos de la persona que habite el lugar y de al menos:", "o": ["Dos vecinos", "Un vecino", "Cinco vecinos", "Ningún vecino"], "e": "Si el domicilio es de extraña jurisdicción, se pide colaboración a la comisaría correspondiente.", "p": 33}, {"id": "m1b-17", "m": "m1", "q": "Según el deber de reserva, los funcionarios policiales pueden brindar información a medios de comunicación sobre un hecho delictivo:", "o": ["Solo con autorización expresa del fiscal y en lo que esté autorizado", "Siempre que lo pida un periodista", "Solo el jefe de la comisaría", "Nunca, ni con autorización"], "e": "Su incumplimiento genera responsabilidad disciplinaria y penal (arts. 248 y 249 CP).", "p": 34}, {"id": "m1b-18", "m": "m1", "q": "Si el personal es convocado por la Central 911, en el acta de procedimiento debe registrarse:", "o": ["El número de carta de incidencia", "El nombre del operador del 911", "La duración de la llamada", "Nada en particular"], "e": "Punto A.2.11 del protocolo.", "p": 34}, {"id": "m1b-19", "m": "m1", "q": "En lesiones leves culposas en accidentes de tránsito, el presunto responsable:", "o": ["No debe quedar aprehendido y se realizan las medidas sin consulta previa a Fiscalía", "Debe quedar siempre aprehendido", "Debe ser trasladado al hospital", "Debe ser derivado a la Justicia Federal"], "e": "Se pregunta a la víctima si desea instar la acción penal (delito de instancia privada).", "p": 34}, {"id": "m1b-20", "m": "m1", "q": "En accidentes de tránsito con lesiones graves o gravísimas, las muestras de sangre y orina de los conductores deben extraerse en un plazo no mayor de:", "o": ["2 horas", "6 horas", "12 horas", "24 horas"], "e": "Son 3 muestras: alcoholemia, alcoholuria y narcolemia.", "p": 35}, {"id": "m1b-21", "m": "m1", "q": "Si hay aprehendidos en un hecho con armas de fuego, el Dermotest debe hacerse:", "o": ["Urgente y PREVIO al cotejo dactiloscópico o ficha dactilar", "Después de la ficha dactilar", "Al día siguiente", "Solo si el imputado lo consiente"], "e": "Evitando que el imputado se lave las manos u orine.", "p": 36}, {"id": "m1b-22", "m": "m1", "q": "Los incisos 1, 3 y 5 del art. 189 bis CP (explosivos, acopio o fabricación de armas y municiones) son de competencia:", "o": ["Federal", "Provincial", "Contravencional", "Municipal"], "e": "En esos casos se consulta con la Fiscalía Federal en turno.", "p": 36}, {"id": "m1b-23", "m": "m1", "q": "En el robo agravado, el «robo en poblado y en banda» (art. 167 inc. 2 CP) requiere la participación de:", "o": ["3 o más personas", "2 o más personas", "5 o más personas", "Una persona armada"], "e": "Debe describirse la cantidad de autores y su participación.", "p": 38}, {"id": "m1b-24", "m": "m1", "q": "En casos de abigeato, el protocolo indica convocar a:", "o": ["La Guardia Rural «Los Pumas» correspondiente", "La Guardia Provincial", "La Brigada de Explosivos", "Defensa Civil"], "e": "Además, el Gabinete Criminalístico de PDI si es necesario tomar rastros.", "p": 39}, {"id": "m1b-25", "m": "m1", "q": "En una estafa bancaria reciente con todos los datos de las cuentas, el personal debe consultar a la Fiscalía para evaluar:", "o": ["La inmovilización de fondos", "La clausura del banco", "La detención del gerente", "El archivo de la causa"], "e": "Se registran banco, tipo de cuenta, CBU/CVU, alias, monto, fechas, etc.", "p": 40}, {"id": "m1b-26", "m": "m1", "q": "En una usurpación, a los ocupantes de la vivienda presuntamente usurpada:", "o": ["No se les toma entrevista; solo se deja constancia en el acta, porque podrían ser autores", "Se les toma entrevista detallada", "Se los desaloja sin consultar a Fiscalía", "Se los cita a declarar como testigos"], "e": "Se les requiere que exhiban documentación del carácter por el que habitan.", "p": 40}, {"id": "m1b-27", "m": "m1", "q": "En un corte de la vía pública (art. 194 CP) en flagrancia, el personal policial debe:", "o": ["Liberar de inmediato la circulación, sin necesidad de comunicación previa con Fiscalía", "Esperar la orden del fiscal antes de actuar", "Limitarse a tomar fotos", "Detener a todos los manifestantes"], "e": "También verificar delitos concomitantes y comunicarse con la entidad objeto del conflicto.", "p": 42}, {"id": "m1b-28", "m": "m1", "q": "Ante una amenaza de bomba (intimidación pública, art. 211 CP), debe convocarse de inmediato a:", "o": ["La Brigada de Explosivos", "Bomberos Zapadores", "Defensa Civil", "La Guardia Rural"], "e": "Si provino del 911, se corrobora el número de incidencia y se pide la grabación.", "p": 42}, {"id": "m1b-29", "m": "m1", "q": "En caso de incendio (art. 186 CP), ¿a quién se convoca para determinar si fue accidental o intencional?", "o": ["A las pericias de Bomberos", "A Defensa Civil", "Al SIES", "A la Guardia Provincial"], "e": "Defensa Civil evalúa posibilidad de derrumbe; SIES constata óbito si corresponde.", "p": 42}, {"id": "m1c-0", "m": "m1", "q": "Ante una adulteración de guarismos (art. 289 inc. 3 CP), ¿qué NO debe hacer el personal policial?", "o": ["Efectuar la pericia de revenido, porque debe autorizarla el Fiscal con control de parte", "Realizar inspección ocular de los guarismos", "Tomar fotografías del motor y chasis", "Dejar constancia de cómo se detectó la adulteración"], "e": "El revenido químico es un acto irreproducible que debe notificarse a la defensa.", "p": 46}, {"id": "m1c-1", "m": "m1", "q": "En una denuncia de averiguación de paradero de un menor de edad, debe darse intervención a:", "o": ["La Dirección Provincial de Niñez, Adolescencia y Familia", "La Guardia Provincial", "La Justicia Federal", "El Registro Civil"], "e": "Además, consultar a Fiscalía para activar el Protocolo de Búsqueda y Localización de personas.", "p": 46}, {"id": "m1c-2", "m": "m1", "q": "La «entrega controlada» se utiliza cuando:", "o": ["La víctima detecta publicados para la venta efectos que le fueron sustraídos; requiere autorización de Fiscalía", "Se entrega un detenido a otra jurisdicción", "Se devuelve un vehículo a su titular", "Se entregan estupefacientes para su destrucción"], "e": "La víctima debe acreditar su propiedad y aportar capturas de pantalla.", "p": 47}, {"id": "m1c-3", "m": "m1", "q": "Ante el hallazgo de un vehículo con pedido de secuestro sin personas aprehendidas, el personal debe:", "o": ["Preservarlo sin tocar manijas ni ingresar, y convocar al Gabinete Criminalístico de PDI", "Abrirlo para buscar documentación", "Trasladarlo inmediatamente con grúa sin peritaje", "Entregarlo al primer interesado"], "e": "También entrevistar vecinos y constatar daños y faltantes.", "p": 48}, {"id": "m1c-4", "m": "m1", "q": "¿Cuál de estos casos requiere consulta OBLIGATORIA e inmediata al 0800-MPA?", "o": ["Secuestro de estupefacientes", "Una contravención de tránsito sin lesionados", "Un ruido molesto", "Un pedido de constancia de extravío"], "e": "También: aprehendidos, homicidios, delitos sexuales, violencia de género, armas de fuego, paraderos, etc.", "p": 48}, {"id": "m1c-5", "m": "m1", "q": "Según el Acta Complementaria N.° 1, ¿qué hechos activan el protocolo especial del 0800-MPA para violencia de género y delitos sexuales?", "o": ["Violencia de género (agresor pareja o ex pareja), maltrato infantil intrafamiliar y delitos sexuales", "Solo homicidios", "Solo robos con armas", "Cualquier contravención"], "e": "Cláusula segunda del Acta Complementaria N.° 1 (vigente desde el 2 de enero de 2026).", "p": 49}, {"id": "m1c-6", "m": "m1", "q": "En delitos sexuales con aprehendidos, ANTES de la consulta con el fiscal el operador del 0800-MPA debe indicar:", "o": ["El traslado de la víctima al Área de Investigación de Violencia de Género, Sexual y Familia", "La liberación del aprehendido", "La toma de declaración de la víctima en la comisaría", "El traslado de la víctima a la Justicia Federal"], "e": "Cláusula cuarta, punto 2.", "p": 50}, {"id": "m1c-7", "m": "m1", "q": "Aun sin aprehendidos, es obligatoria la consulta al 0800-MPA en delitos contra la integridad sexual con acceso carnal cometidos en las últimas:", "o": ["96 horas", "24 horas", "48 horas", "7 días"], "e": "También si el agresor es conviviente o si hubo amenazas con armas de fuego exhibidas.", "p": 50}, {"id": "m1c-8", "m": "m1", "q": "Cuando personal policial es sindicado como autor o partícipe de un delito, la consulta debe canalizarse obligatoriamente a través de:", "o": ["La División Judiciales (u órgano de control interno)", "El jefe directo del imputado", "La prensa institucional", "El 911"], "e": "Cláusula quinta del Acta Complementaria N.° 1, para garantizar transparencia.", "p": 51}, {"id": "m1c-9", "m": "m1", "q": "Al secuestrar un teléfono celular, según el Acta Complementaria N.° 1 debe envolverse en papel de aluminio de al menos:", "o": ["Tres capas (o bolsa tipo Faraday)", "Una capa", "Dos capas", "Cinco capas"], "e": "Además en modo avión, sin apagar y, si es posible, mantenerlo cargado.", "p": 51}, {"id": "m1c-10", "m": "m1", "q": "Ante el hallazgo de plantas de cannabis sin indicios claros de comercialización y con inscripción en el Reprocann:", "o": ["No corresponde el secuestro", "Se secuestran siempre todas las plantas", "Se destruyen en el lugar", "Se detiene al morador"], "e": "En caso de duda sobre la vigencia del Reprocann, la regla general es no secuestrar, pero sí tomar fotos y filmaciones.", "p": 52}, {"id": "m1c-11", "m": "m1", "q": "Si se hallan MÁS de cuántas plantas de cannabis debe consultarse con el Ministerio Público Fiscal de la Nación?", "o": ["Nueve", "Cinco", "Tres", "Veinte"], "e": "Cláusula séptima del Acta Complementaria N.° 1.", "p": 52}, {"id": "m1c-12", "m": "m1", "q": "Al pesar material vegetal de cannabis secuestrado, antes del pesaje definitivo debe realizarse:", "o": ["El «deshoje»: separar flores y hojas de tallos, raíces y macetas", "El secado al sol", "La molienda", "Nada, se pesa la planta entera con maceta"], "e": "El peso comunicado debe corresponder solo al material con capacidad estupefaciente.", "p": 52}, {"id": "m1c-13", "m": "m1", "q": "En casos de maltrato y crueldad animal (Ley 14.346) interviene:", "o": ["La Sección Ecológica de la Policía", "La Guardia Rural Los Pumas", "Bomberos", "La PDI"], "e": "Los animales secuestrados se derivan a los establecimientos correspondientes sin necesidad de orden fiscal.", "p": 52}, {"id": "m1c-14", "m": "m1", "q": "El «Código Lince» se aplica:", "o": ["Exclusivamente en el distrito Rosario, ante flagrancia virtual o cuasi flagrancia con intervención del Área LINCE", "En toda la provincia para cualquier delito", "Solo en la ciudad de Santa Fe", "Para hechos de violencia de género"], "e": "Acta Complementaria N.° 2 — seguimiento en tiempo real por cámaras.", "p": 56}, {"id": "m1c-15", "m": "m1", "q": "Según el Acta Complementaria N.° 2, el cotejo dactiloscópico de aprehendidos:", "o": ["No debe hacerse en todos los casos; se reserva para quienes no tienen DNI o hay dudas sobre su identidad", "Es obligatorio en todos los casos", "Está prohibido", "Solo lo hace la Justicia Federal"], "e": "La identificación es primariamente mediante el DNI.", "p": 57}, {"id": "m1c-16", "m": "m1", "q": "Según el Acta Complementaria N.° 2, la calificación legal del hecho:", "o": ["Es competencia exclusiva del Fiscal; el policía debe limitarse a describir objetivamente los hechos", "La debe hacer siempre el oficial actuante en el acta", "La hace el jefe de la comisaría", "La define la víctima"], "e": "Se prohíbe exigir al personal policial que encuadre el hecho en una figura penal.", "p": 58}, {"id": "m1c-17", "m": "m1", "q": "El Programa Recompensas de Santa Fe ofrece dinero por datos que permitan esclarecer homicidios no resueltos ocurridos desde el año:", "o": ["2014", "2005", "2020", "2010"], "e": "Garantiza reserva absoluta de la identidad de quien aporta información.", "p": 58}, {"id": "m1c-18", "m": "m1", "q": "El pago de la recompensa se realiza:", "o": ["En sobre cerrado lacrado que no forma parte del expediente", "Por transferencia bancaria registrada en la causa", "En audiencia pública", "Mediante cheque a nombre del informante"], "e": "Así el nombre de quien aportó datos no aparece en ningún lado.", "p": 59}, {"id": "m1c-19", "m": "m1", "q": "El Fondo Provincial de Recompensas se integra con una suma equivalente al:", "o": ["0,45% del presupuesto del Ministerio de Justicia y Derechos Humanos", "1% del presupuesto provincial", "5% del presupuesto policial", "10% de las multas por estupefacientes"], "e": "Art. 40 de la Ley 13.494; el saldo no invertido pasa al ejercicio siguiente.", "p": 60}, {"id": "m1c-20", "m": "m1", "q": "¿Quiénes están EXCLUIDOS de cobrar recompensas según el art. 43 de la Ley 13.494?", "o": ["Los miembros de las fuerzas de seguridad o inteligencia, en actividad o retirados", "Los familiares de la víctima", "Los vecinos del lugar del hecho", "Los extranjeros"], "e": "También autores/cómplices/encubridores y funcionarios con deber de denunciar.", "p": 60}, {"id": "m1c-21", "m": "m1", "q": "El nuevo Código Procesal Penal Juvenil (Ley 14.228) entró en vigor el:", "o": ["21 de junio de 2025", "1 de enero de 2024", "2 de enero de 2026", "27 de abril de 2026"], "e": "Eliminó la antigua Justicia de Menores; la acción penal pública está a cargo del MPA.", "p": 61}, {"id": "m1c-22", "m": "m1", "q": "Según la Ley 14.228, en caso de duda sobre la edad de la persona imputada:", "o": ["Se presume que es menor de edad hasta que se acredite fehacientemente lo contrario", "Se presume mayor de edad", "Se la libera", "Decide el personal policial"], "e": "Art. 1 — ámbito de aplicación.", "p": 62}, {"id": "m1c-23", "m": "m1", "q": "El proceso penal juvenil aplica el principio de justicia restaurativa, cuyos objetivos son:", "o": ["Reintegración social del menor, restauración de la paz social y reparación del daño", "Aplicar siempre la pena máxima", "Juzgar al menor como adulto", "Evitar la intervención de la víctima"], "e": "Se priorizan la desjudicialización y soluciones alternativas a la pena.", "p": 62}, {"id": "m1d-0", "m": "m1", "q": "En el proceso penal juvenil, la revisión de las medidas que impliquen encierro se hace en audiencia como máximo cada:", "o": ["90 días", "30 días", "180 días", "1 año"], "e": "Con informe del equipo interdisciplinario.", "p": 63}, {"id": "m1d-1", "m": "m1", "q": "En la suspensión del procedimiento a prueba para menores (art. 7, Ley 14.228), el plazo de las condiciones impuestas no puede superar:", "o": ["2 años", "1 año", "3 años", "6 meses"], "e": "Cumplidas las condiciones, se dispone el sobreseimiento.", "p": 63}, {"id": "m1d-2", "m": "m1", "q": "¿Cuál de estos es un derecho especialmente garantizado al imputado menor de edad (art. 13, Ley 14.228)?", "o": ["No ser sometido a interrogatorio por parte de autoridades policiales o fuerzas de seguridad", "Ejercer su propia autodefensa", "Ser alojado con mayores si lo solicita", "Declarar bajo juramento"], "e": "No se permite la autodefensa del menor; tiene derecho a defensor y a la presencia de un adulto responsable.", "p": 65}, {"id": "m1d-3", "m": "m1", "q": "En el proceso penal juvenil, el querellante adhesivo:", "o": ["Actúa dentro de los límites del fiscal; no puede pedir más pena que el MPA ni discutir la pena", "Puede convertir la acción y acusar solo", "Puede pedir más pena que el fiscal", "No puede participar"], "e": "No es aplicable el instituto de conversión de la acción.", "p": 66}, {"id": "m1d-4", "m": "m1", "q": "La investigación penal preparatoria juvenil se inicia:", "o": ["Exclusivamente por decisión del Fiscal; la policía debe darle inmediato aviso", "Por decisión de la policía", "Por decisión del juez de menores", "Por denuncia de los padres"], "e": "Art. 27 de la Ley 14.228.", "p": 66}, {"id": "m1d-5", "m": "m1", "q": "El personal policial solo puede privar de la libertad a un menor de edad:", "o": ["Por orden del Fiscal o en caso de flagrancia", "Siempre que lo considere necesario", "Con autorización de los padres", "Solo con orden de un juez federal"], "e": "La aprehensión se comunica de inmediato al Fiscal y a los adultos responsables.", "p": 66}, {"id": "m1d-6", "m": "m1", "q": "Respecto de la incomunicación de menores de edad:", "o": ["Está prohibida, salvo grave riesgo para la investigación y disposición del Fiscal", "Puede disponerla el oficial de guardia", "Es obligatoria las primeras 24 horas", "Puede impedir la comunicación con el defensor"], "e": "Nunca alcanza al defensor antes de declarar.", "p": 67}, {"id": "m1d-7", "m": "m1", "q": "Si el menor imputado está detenido, la audiencia imputativa debe realizarse como máximo dentro de:", "o": ["48 horas, prorrogables por 24 horas", "24 horas, prorrogables por 12", "72 horas", "5 días"], "e": "Art. 29 de la Ley 14.228.", "p": 67}, {"id": "m1d-8", "m": "m1", "q": "En instituciones que no permitan la salida voluntaria, la privación de libertad de un menor durante el proceso no puede exceder:", "o": ["2 años, prorrogable como máximo por 1 año más", "6 meses", "1 año, sin prórroga", "5 años"], "e": "Vencido el plazo sin iniciar el debate, se otorga la libertad sin más trámite.", "p": 68}, {"id": "m1d-9", "m": "m1", "q": "Para imponer medidas socioeducativas a un menor SIN sentencia de responsabilidad se requiere:", "o": ["El consentimiento del imputado", "La autorización de la víctima", "La orden del jefe de policía", "Nada, son obligatorias"], "e": "Art. 34 de la Ley 14.228.", "p": 69}, {"id": "m1d-10", "m": "m1", "q": "El enjuiciamiento de una persona menor de edad se realiza en:", "o": ["Dos etapas: juicio de responsabilidad penal y juicio de determinación de la pena o su innecesariedad", "Una sola audiencia", "Tres instancias obligatorias", "Un juicio por jurados"], "e": "Es la llamada «cesura» del juicio.", "p": 70}, {"id": "m1d-11", "m": "m1", "q": "En el juicio de responsabilidad penal juvenil, el Tribunal:", "o": ["Nunca puede requerir declaración al menor ni pedirle juramento de decir verdad", "Puede obligarlo a declarar", "Debe tomarle juramento", "Lo interroga primero"], "e": "El menor tiene derecho a ser oído cuando lo pida.", "p": 71}, {"id": "m1d-12", "m": "m1", "q": "Según el Decreto 1170/2025, la Dirección General de Policía de Seguridad Vial pasa a denominarse:", "o": ["Guardia Provincial", "Policía de Acción Táctica", "Agencia Provincial de Seguridad Vial", "Tropa de Operaciones Especiales"], "e": "Adopta un perfil operativo-policial de prevención del delito en rutas y corredores.", "p": 74}, {"id": "m1d-13", "m": "m1", "q": "Con la reorganización en Guardia Provincial, las tareas de seguridad vial y control de tránsito tienden a transferirse a:", "o": ["Organismos civiles, como la Agencia Provincial de Seguridad Vial", "La PDI", "Los municipios exclusivamente", "Gendarmería Nacional"], "e": "Se crea un Programa de Fortalecimiento Institucional en la Agencia.", "p": 74}, {"id": "m1d-14", "m": "m1", "q": "El nuevo art. 30 de la Constitución de Santa Fe reconoce el derecho a vivir en un entorno:", "o": ["Físico y digital seguro, libre de violencias y amenazas", "Solo físico seguro", "Libre de contaminación", "Con vivienda digna"], "e": "La seguridad pública es un deber indelegable e irrenunciable de la Provincia.", "p": 76}, {"id": "m1d-15", "m": "m1", "q": "Según la reforma constitucional, el uso de la fuerza por parte de la Provincia es:", "o": ["Excepcional y conforme al ordenamiento jurídico, constitucional y convencional", "La regla general", "Delegable a la seguridad privada", "Discrecional"], "e": "La Provincia ejerce el monopolio de la fuerza.", "p": 76}, {"id": "m1d-16", "m": "m1", "q": "Según el art. 134 de la Constitución provincial reformada, el Ministerio Público es:", "o": ["Un órgano independiente de los poderes del Estado, con autonomía funcional y administrativa y autarquía financiera", "Parte del Poder Ejecutivo", "Parte del Poder Judicial", "Dependiente del Ministerio de Seguridad"], "e": "Se compone del MPA y del MPD, independientes entre sí (extrapoder).", "p": 77}, {"id": "m1d-17", "m": "m1", "q": "El fiscal general y el defensor general duran en su cargo:", "o": ["5 años, con posibilidad de una sola redesignación consecutiva", "4 años, sin reelección", "Hasta los 70 años", "6 años, reelegibles indefinidamente"], "e": "Cesan de pleno derecho a los 75 años.", "p": 77}, {"id": "m1d-18", "m": "m1", "q": "El fiscal general puede ser removido por:", "o": ["La Asamblea Legislativa, por mayoría absoluta, por mal desempeño o delito doloso", "El Gobernador por decreto", "La Corte Suprema", "Un jury de enjuiciamiento municipal"], "e": "El procedimiento es acusatorio y público.", "p": 78}, {"id": "m1d-19", "m": "m1", "q": "Según el art. 14 de la Constitución provincial, en caso de detención debe darse aviso inmediato a un juez para que revise la medida en un plazo máximo de:", "o": ["24 horas", "48 horas", "72 horas", "12 horas"], "e": "La incomunicación no puede superar 48 horas salvo resolución judicial.", "p": 79}, {"id": "m1d-20", "m": "m1", "q": "La contravención de ebriedad (art. 89 del Código de Faltas) se sanciona con:", "o": ["Arresto de hasta 15 días", "Multa de hasta 5 jus", "Arresto de hasta 30 días", "Trabajo comunitario"], "e": "Para ebrios habituales, el juez puede ordenar internación de hasta 90 días.", "p": 80}, {"id": "m1d-21", "m": "m1", "q": "El acoso sexual callejero (art. 84 bis) se sanciona con:", "o": ["Multa de 1 a 5 jus y/o curso presencial sobre violencia de género", "Arresto de hasta 30 días", "Inhabilitación para conducir", "Arresto de hasta 15 días"], "e": "Siempre que el hecho no constituya delito.", "p": 80}, {"id": "m1d-22", "m": "m1", "q": "La conducción peligrosa (art. 105) en estado de ebriedad se agrava con:", "o": ["Arresto hasta 30 días y multa hasta 6 jus, más posible inhabilitación de hasta 90 días", "Arresto hasta 15 días y multa hasta 3 jus", "Solo multa", "Arresto hasta 60 días"], "e": "La pena base es arresto hasta 15 días y multa hasta 3 jus.", "p": 81}, {"id": "m1e-0", "m": "m1", "q": "En el procedimiento por art. 10 bis de la Ley Orgánica Policial (demora para identificación), la demora no puede exceder:", "o": ["6 horas corridas", "12 horas", "24 horas", "2 horas"], "e": "Debe darse aviso inmediato al Servicio Público Provincial de la Defensa Penal.", "p": 83}, {"id": "m1e-1", "m": "m1", "q": "Durante la demora por art. 10 bis LOP, la persona demorada:", "o": ["Tiene derecho a una llamada telefónica y no puede ser alojada con detenidos por delitos o contravenciones", "Queda incomunicada", "Puede ser alojada en calabozos comunes", "No tiene derecho a copia del acta"], "e": "Se halla en carácter de comunicado y recibe copia del acta.", "p": 83}, {"id": "m1e-2", "m": "m1", "q": "El acta del procedimiento por art. 10 bis LOP debe estar firmada por el funcionario actuante, la persona demorada y:", "o": ["Dos testigos que hubieran presenciado el procedimiento, si los hubiere", "El fiscal de turno", "El jefe de la comisaría", "Un abogado"], "e": "Con entrega de copias a los interesados.", "p": 83}, {"id": "m1e-3", "m": "m1", "q": "El Programa de Policiamiento Urbano de Santa Fe se compone de tres etapas:", "o": ["SAE 911, Sistema de Patrullaje por Capas y Cuadrantes (SPC2) y Programa M3", "Prevención, Investigación y Juicio", "Capa 1, Capa 2 y Capa 3 solamente", "Estaciones Policiales, Puntos de Ingreso y Comisarías"], "e": "Es la estrategia de patrullaje preventivo para los grandes centros urbanos.", "p": 84}, {"id": "m1e-4", "m": "m1", "q": "En el SPC2, la Capa 1 corresponde a:", "o": ["Patrullaje preventivo y respuesta al 911", "Policiamiento focalizado con grupos tácticos", "Supervisión y refuerzo operativo", "Investigación criminal"], "e": "Indicadores: cobertura por cuadrante y Tiempo de Respuesta al Ciudadano (TRC).", "p": 85}, {"id": "m1e-5", "m": "m1", "q": "En el SPC2, la superficie de cada cuadrante es:", "o": ["Inversamente proporcional a la cantidad de requerimientos policiales", "Igual para todos los cuadrantes", "Proporcional a la población", "Definida por los límites de cada barrio"], "e": "Se diseña según la demanda histórica al 911, las arterias y los móviles disponibles.", "p": 86}, {"id": "m1e-6", "m": "m1", "q": "La Capa 2 del SPC2 (policiamiento focalizado) trabaja sobre:", "o": ["Áreas y Zonas Priorizadas, con grupos tácticos especiales", "Todos los cuadrantes por igual", "Eventos masivos exclusivamente", "Llamados al 911"], "e": "Las Áreas tienen problemas estructurales y son de largo plazo; las Zonas Priorizadas tienen plazo determinado.", "p": 86}, {"id": "m1e-7", "m": "m1", "q": "La Capa 3 del SPC2 está a cargo de:", "o": ["Superiores de servicio y servicios adicionales (supervisión y refuerzo)", "Grupos tácticos especiales", "Móviles de respuesta al 911", "La PDI"], "e": "Monitorea cumplimiento y calidad del servicio.", "p": 86}, {"id": "m1e-8", "m": "m1", "q": "La sigla M3 del programa de policiamiento significa:", "o": ["Mapeo del delito, Métricas de productividad policial y Monitoreo de indicadores", "Mando, Misión y Medios", "Movilidad, Mantenimiento y Munición", "Métodos, Manuales y Mejoras"], "e": "Es la tercera etapa y busca profesionalizar el policiamiento mediante mejora continua.", "p": 87}, {"id": "m1e-9", "m": "m1", "q": "El Plan de Reorganización Policial para Grandes Centros Urbanos reemplaza el modelo centrado en la comisaría por:", "o": ["El Sistema de Estaciones Policiales y Puntos de Ingreso", "Comisarías móviles", "Destacamentos barriales", "Centrales 911 descentralizadas"], "e": "Prevé seis Estaciones en Rosario y tres en Santa Fe.", "p": 88}, {"id": "m1e-10", "m": "m1", "q": "Los «Puntos de Ingreso» del nuevo modelo policial son:", "o": ["Dispositivos especializados para la recepción y tratamiento de procedimientos policiales y diligencias judiciales", "Accesos viales a las ciudades", "Oficinas de atención al público para denuncias", "Centros de detención de menores"], "e": "Agilizan procesos y liberan personal para tareas preventivas.", "p": 89}, {"id": "m1e-11", "m": "m1", "q": "El Programa de Patrullaje a Pie Focalizado (PPF) se basa en el análisis de:", "o": ["«Zonas Calientes» donde se concentra de manera desproporcionada el delito predatorio", "La cantidad de comisarías por barrio", "Las denuncias de violencia de género", "Los accidentes de tránsito"], "e": "Es parte del llamado policiamiento predictivo; se evalúa con el método «Diferencia en Diferencias».", "p": 90}, {"id": "m1e-12", "m": "m1", "q": "En el patrullaje focalizado, los binomios realizan detenciones de 10 a 15 minutos en los llamados:", "o": ["Puntos de anclaje", "Puntos de control", "Puestos fijos", "Cuadrantes"], "e": "Seleccionados en lugares de gran circulación, como escuelas o centros comerciales.", "p": 91}, {"id": "m1e-13", "m": "m1", "q": "Las Intervenciones Barriales Focalizadas (IBF) tienen como objetivo:", "o": ["Disminuir y prevenir la violencia altamente lesiva en los barrios más afectados, con trabajo multiagencial", "Aumentar las multas de tránsito", "Reducir la cantidad de efectivos en los barrios", "Controlar exclusivamente el narcomenudeo"], "e": "Se fundamentan en la alta tasa de homicidios de Rosario (22 cada 100 mil habitantes en 2022).", "p": 92}, {"id": "m1e-14", "m": "m1", "q": "¿Cuál es el componente de las IBF que incluye persecución penal estratégica, ordenamiento del espacio público y policiamiento?", "o": ["Componente de Regulación y Control", "Componente Socio-Cultural", "Componente Urbano-Ambiental", "Componente Comunicacional"], "e": "Intervienen el Poder Judicial, el Ministerio de Justicia y Seguridad y áreas municipales.", "p": 95}, {"id": "m1e-15", "m": "m1", "q": "La Ley Nacional 26.485 es la ley de:", "o": ["Protección integral para prevenir, sancionar y erradicar la violencia contra las mujeres", "Identidad de género", "Violencia familiar de Santa Fe", "Estupefacientes"], "e": "Santa Fe adhirió mediante la Ley 13.348 (reglamentada por Decreto 4028/13).", "p": 97}, {"id": "m1e-16", "m": "m1", "q": "¿Cuántos tipos de violencia contra las mujeres enumera el art. 5 de la Ley 26.485 según el material?", "o": ["Seis: física, psicológica, sexual, económica y patrimonial, simbólica y política", "Tres: física, psicológica y sexual", "Nueve", "Cuatro"], "e": "Las modalidades (art. 6) son otra clasificación: doméstica, institucional, laboral, etc.", "p": 100}, {"id": "m1e-17", "m": "m1", "q": "La violencia que, a través de patrones estereotipados, mensajes o íconos, reproduce dominación y discriminación es la violencia:", "o": ["Simbólica", "Psicológica", "Mediática", "Institucional"], "e": "Incluye acciones que invisibilizan la realidad de lesbianas, bisexuales y transexuales.", "p": 99}, {"id": "m1e-18", "m": "m1", "q": "La percepción de un salario menor por igual tarea dentro del mismo lugar de trabajo es un ejemplo de violencia:", "o": ["Económica y patrimonial", "Simbólica", "Física", "Obstétrica"], "e": "También: limitación o control de ingresos, retención de documentos o bienes.", "p": 99}, {"id": "m1e-19", "m": "m1", "q": "La violencia ejercida por funcionarios de un organismo público para retardar u obstaculizar el acceso de las mujeres a sus derechos es la modalidad:", "o": ["Institucional", "Doméstica", "Laboral", "Mediática"], "e": "Comprende también a partidos políticos, sindicatos y organizaciones civiles.", "p": 100}, {"id": "m1e-20", "m": "m1", "q": "La violencia ejercida por el personal de salud sobre el cuerpo y los procesos reproductivos de las mujeres, con trato deshumanizado, es la violencia:", "o": ["Obstétrica", "Contra la libertad reproductiva", "Institucional", "Física"], "e": "Ley 25.929 (parto respetado).", "p": 101}, {"id": "m1e-21", "m": "m1", "q": "La difusión no consentida de material íntimo de una mujer a través de las TIC es una forma de violencia:", "o": ["Digital o telemática", "Mediática", "Simbólica", "Pública-política"], "e": "Inciso i) del art. 6 de la Ley 26.485.", "p": 102}, {"id": "m1e-22", "m": "m1", "q": "¿Cuáles son las tres fases del ciclo de la violencia de género?", "o": ["Acumulación de tensión, explosión/agresión y reconciliación («luna de miel»)", "Control, aislamiento y abandono", "Denuncia, juicio y condena", "Celos, discusión y separación"], "e": "El ciclo es repetitivo y suele aumentar la violencia, lo que explica por qué muchas víctimas retiran la denuncia.", "p": 103}, {"id": "m1e-23", "m": "m1", "q": "Según el material, ¿existe en el Código Penal un tipo penal autónomo llamado «violencia de género»?", "o": ["No; la violencia de género funciona como circunstancia calificante de delitos ya existentes", "Sí, es el art. 80 inc. 11", "Sí, es una contravención", "Sí, está en la Ley 26.485 como delito autónomo"], "e": "Ej.: lesiones, amenazas, homicidio pueden agravarse en contexto de violencia de género.", "p": 105}, {"id": "m1f-0", "m": "m1", "q": "La Convención Interamericana para Prevenir, Sancionar y Erradicar la Violencia contra la Mujer se conoce como:", "o": ["Convención de Belém do Pará", "CEDAW", "Pacto de San José de Costa Rica", "Convención de Viena"], "e": "Define violencia contra la mujer como cualquier acción o conducta basada en su género que cause muerte, daño o sufrimiento.", "p": 106}, {"id": "m1f-1", "m": "m1", "q": "¿Qué ley de 2012 incorporó al Código Penal los delitos de género (como el femicidio)?", "o": ["Ley 26.791", "Ley 26.485", "Ley 26.743", "Ley 11.529"], "e": "Sustituyó los incisos 1° y 4° del art. 80 e incorporó los incisos 11 y 12.", "p": 107}, {"id": "m1f-2", "m": "m1", "q": "El femicidio está tipificado en el:", "o": ["Art. 80 inc. 11 del Código Penal", "Art. 80 inc. 1 del Código Penal", "Art. 80 inc. 12 del Código Penal", "Art. 92 del Código Penal"], "e": "Matar a una mujer cuando el hecho sea perpetrado por un hombre y mediare violencia de género.", "p": 108}, {"id": "m1f-3", "m": "m1", "q": "El homicidio transversal o vinculado (art. 80 inc. 12 CP) consiste en:", "o": ["Matar a una persona con el propósito de causar sufrimiento a la pareja o ex pareja", "Matar a la pareja o ex pareja", "Matar por odio de género", "Matar a un ascendiente"], "e": "No es necesario que la otra persona efectivamente sufra; basta la intención.", "p": 111}, {"id": "m1f-4", "m": "m1", "q": "El homicidio agravado por el vínculo o relación de pareja (art. 80 inc. 1 CP):", "o": ["No es por sí un delito de género: la víctima puede ser varón o mujer", "Solo se aplica si la víctima es mujer", "Requiere convivencia", "Excluye a ex parejas"], "e": "Si además hay violencia de género contra una mujer, concurre idealmente con el inc. 11.", "p": 108}, {"id": "m1f-5", "m": "m1", "q": "Las circunstancias extraordinarias de atenuación del art. 80 in fine NO se aplican cuando:", "o": ["El autor realizó anteriormente actos de violencia contra la mujer víctima", "El autor es primario", "La víctima era ex cónyuge", "El hecho ocurrió en la vía pública"], "e": "Esos actos previos no requieren sentencia condenatoria previa.", "p": 108}, {"id": "m1f-6", "m": "m1", "q": "Según el art. 92 CP, las lesiones se agravan cuando concurre alguna de las circunstancias del:", "o": ["Art. 80 CP", "Art. 166 CP", "Art. 149 bis CP", "Art. 189 bis CP"], "e": "Así las lesiones se agravan por relación de pareja, odio de género, violencia de género y venganza transversal.", "p": 111}, {"id": "m1f-7", "m": "m1", "q": "Las lesiones leves en contexto de violencia de género, aunque sean de instancia privada, pueden promoverse de oficio por:", "o": ["Razones de interés público o de seguridad (art. 72 CP)", "Decisión del personal policial", "Pedido de cualquier vecino", "Nunca, siempre requieren instancia de la víctima"], "e": "La violencia de género excede el ámbito privado y es de interés público.", "p": 111}, {"id": "m1f-8", "m": "m1", "q": "En los delitos de violencia de género cometidos en la intimidad, el principio «testis unus, testis nullus» (testigo único, testigo nulo):", "o": ["Pierde vigor: la palabra de la víctima puede fundar por sí sola la prueba", "Sigue vigente: sin otro testigo no hay prueba", "Solo se aplica en lesiones graves", "Obliga a archivar la causa"], "e": "Rige la amplitud probatoria del art. 16 de la Ley 26.485.", "p": 113}, {"id": "m1f-9", "m": "m1", "q": "¿Cuál de estas preguntas a una denunciante de violencia de género es considerada revictimizante?", "o": ["«¿Por qué no te fuiste?»", "«¿En qué fecha ocurrió el hecho?»", "«¿Hubo testigos?»", "«¿Hay mensajes que lo prueben?»"], "e": "También: ¿por qué no lo frenaste?, ¿por qué no gritaste?, ¿le fuiste infiel?", "p": 115}, {"id": "m1f-10", "m": "m1", "q": "Según la Ley 26.485, ¿quiénes están obligados a denunciar hechos de violencia contra las mujeres que conozcan en sus tareas?", "o": ["Quienes trabajan en servicios asistenciales, sociales, educativos y de salud, públicos o privados", "Solo los familiares", "Solo la víctima", "Solo los abogados"], "e": "Aun cuando el hecho no configure delito.", "p": 116}, {"id": "m1f-11", "m": "m1", "q": "¿Qué está prohibido exigir a una denunciante de violencia de género en la comisaría?", "o": ["Testigos como requisito para tomarle la denuncia", "El DNI", "La firma de la denuncia", "Un relato de los hechos"], "e": "No se necesitan pruebas ni testigos al momento de denunciar; los trámites son gratuitos.", "p": 118}, {"id": "m1f-12", "m": "m1", "q": "En Santa Fe, para las medidas civiles en violencia doméstica (exclusión del hogar, alimentos provisorios, etc.) son competentes:", "o": ["Los Tribunales de Familia", "Los juzgados federales", "Los juzgados de faltas", "La comisaría"], "e": "Se solicitan a través de la Unidad de información y atención de víctimas y denunciantes.", "p": 119}, {"id": "m1f-13", "m": "m1", "q": "Una niña o adolescente víctima de violencia de género puede denunciar:", "o": ["Sin autorización de su responsable parental, por el principio de autonomía progresiva", "Solo con autorización de ambos padres", "Solo a partir de los 18 años", "Solo a través de la escuela"], "e": "Se recomienda que las entrevistas judiciales se hagan en cámara Gesell.", "p": 119}, {"id": "m1f-14", "m": "m1", "q": "Ante un policía denunciado por violencia de género con portación de arma, ¿cuál de estas medidas corresponde?", "o": ["Suspensión provisional de empleo, quita del arma reglamentaria y sumario con pase a disponibilidad o pasiva", "Traslado a otra dependencia sin más trámite", "Ninguna hasta la condena penal", "Solo un apercibimiento"], "e": "Resolución 0754/21 (reformada por Res. 1103/22).", "p": 122}, {"id": "m1f-15", "m": "m1", "q": "Para restituir el arma reglamentaria a un policía denunciado por violencia de género se requieren:", "o": ["No menos de 3 entrevistas psicológicas/psiquiátricas de la Dirección de Medicina Legal", "Una autorización verbal del jefe", "La sentencia absolutoria firme", "Un examen de tiro"], "e": "Se evalúa también la aptitud psicofísica.", "p": 122}, {"id": "m1f-16", "m": "m1", "q": "Si la víctima de violencia de género es personal policial, se la debe derivar a:", "o": ["La Dirección de Bienestar de las Fuerzas de Seguridad", "La Guardia Provincial", "El D-2 Informaciones", "La Agencia de Control Policial exclusivamente"], "e": "Promueve el bienestar integral del personal y su grupo familiar.", "p": 122}, {"id": "m1f-17", "m": "m1", "q": "Según el art. 133 del RSA, quien se halle en situación de disponibilidad o pasiva:", "o": ["Es relevado del servicio y privado del uso de uniforme, arma y credencial", "Sigue prestando servicio normalmente", "Solo pierde la credencial", "Conserva el arma"], "e": "Medidas cautelares ante faltas graves vinculadas a violencia de género.", "p": 120}, {"id": "m1f-18", "m": "m1", "q": "La Ley 26.743 de Identidad de Género define la identidad de género como:", "o": ["La vivencia interna e individual del género tal como cada persona la siente, que puede o no corresponder con el sexo asignado al nacer", "El sexo biológico de nacimiento", "La orientación sexual de la persona", "La forma en que los demás perciben a la persona"], "e": "Incluye la vivencia personal del cuerpo y otras expresiones de género.", "p": 123}, {"id": "m1f-19", "m": "m1", "q": "¿Qué se requiere para la rectificación registral del sexo según la Ley 26.743?", "o": ["Tener 18 años (salvo excepción art. 5), presentar la solicitud ante el RENAPER y expresar el nuevo nombre", "Acreditar cirugía de reasignación genital", "Acreditar terapia hormonal", "Autorización judicial"], "e": "En ningún caso se exige intervención quirúrgica ni tratamientos médicos o psicológicos.", "p": 123}, {"id": "m1f-20", "m": "m1", "q": "Una vez realizada la rectificación registral por la Ley 26.743, solo puede volver a modificarse:", "o": ["Con autorización judicial", "Por un nuevo trámite administrativo libre", "Nunca", "Con autorización del Registro Civil"], "e": "Los trámites son gratuitos, personales y sin gestores.", "p": 124}, {"id": "m1f-21", "m": "m1", "q": "Según el «trato digno» de la Ley 26.743, cuando la persona deba ser nombrada en público:", "o": ["Debe usarse únicamente el nombre de pila de elección", "Debe usarse el nombre del DNI", "Debe usarse solo el apellido", "Debe usarse el número de documento"], "e": "A su solo requerimiento, el nombre adoptado se usa en citaciones, registros y llamados.", "p": 126}, {"id": "m1f-22", "m": "m1", "q": "La diferencia entre identidad de género y expresión de género es que:", "o": ["La identidad es cómo la persona se asume a sí misma; la expresión es la manifestación externa de rasgos que los demás interpretan", "Son sinónimos", "La expresión de género depende del sexo biológico", "La identidad de género es la orientación sexual"], "e": "Ambas son independientes de la orientación sexual.", "p": 127}, {"id": "m1f-23", "m": "m1", "q": "La Ley 11.529 de Santa Fe regula:", "o": ["La violencia familiar", "La identidad de género", "El microtráfico", "El Código Procesal Penal Juvenil"], "e": "Comprende a quienes sufran lesiones o malos tratos por integrantes del grupo familiar.", "p": 129}, {"id": "m1f-24", "m": "m1", "q": "Según la Ley 11.529, el informe médico sobre la persona agredida debe realizarse dentro de:", "o": ["3 horas", "24 horas", "48 horas", "72 horas"], "e": "Debe contener la mayor cantidad de datos para evaluar el riesgo.", "p": 129}, {"id": "m1f-25", "m": "m1", "q": "Según la Ley 11.529, el Fiscal en causa penal puede adoptar de inmediato la exclusión del agresor o la prohibición de acceso por un máximo de:", "o": ["72 horas, comunicándolo al juez competente", "24 horas", "10 días", "30 días"], "e": "Las medidas autosatisfactivas las dicta el juez de Familia.", "p": 130}, {"id": "m2-0", "m": "m2", "q": "Según el material, ¿qué es el «mando»?", "o": ["La acción que ejerce el jefe sobre sus subordinados para dirigirlos, persuadirlos e influir sobre ellos y obtener su voluntaria obediencia (autoridad moral)", "El ejercicio de la autoridad y responsabilidad legales sobre una organización policial (autoridad legal)", "La aplicación del comando a la solución de un problema policial (autoridad operacional)", "La facultad de sancionar disciplinariamente al personal subordinado"], "e": "El mando se vincula con la autoridad moral; el comando con la autoridad legal; la conducción con la autoridad operacional.", "p": 134}, {"id": "m2-1", "m": "m2", "q": "El «comando» se define como:", "o": ["El ejercicio de la autoridad y responsabilidad legales sobre una organización policial, prescripto y limitado por leyes y reglamentos", "La influencia personal del jefe para lograr la adhesión voluntaria del personal", "Un arte, actividad libre y creadora que se apoya sobre bases científicas", "La técnica de apreciación, resolución, órdenes y supervisión"], "e": "Comando = función del grado y cargo, regulada taxativamente por leyes y reglamentos (autoridad legal).", "p": 135}, {"id": "m2-2", "m": "m2", "q": "La «conducción» es:", "o": ["La aplicación del comando a la solución de un problema policial; un arte que se apoya sobre bases científicas (autoridad operacional)", "El ejercicio de la autoridad legal sobre una organización policial", "La acción del jefe para obtener la voluntaria obediencia del personal", "El conjunto de leyes que regulan la carrera policial"], "e": "En el ámbito empresarial la conducción equivale a administración, gestión o management.", "p": 135}, {"id": "m2-3", "m": "m2", "q": "En el ámbito empresarial, el «mando» es conocido como:", "o": ["Liderazgo", "Gerenciamiento", "Administración", "Dirección"], "e": "El material indica que en ambiente empresarial el mando es conocido como «liderazgo», mientras que la conducción se asimila a administración/gestión/management.", "p": 134}, {"id": "m2-4", "m": "m2", "q": "Según los tipos de mando, si un jefe se excede en lo persuasivo se corrompe en:", "o": ["Indolente o demagogo", "Déspota, ególatra o terco", "Autoritario", "Correcto"], "e": "Los límites del mando correcto son el autoritario y el persuasivo. Excederse en lo autoritario lleva a déspota, ególatra o terco; excederse en lo persuasivo, a indolente o demagogo.", "p": 134}, {"id": "m2-5", "m": "m2", "q": "Si un jefe se excede de lo autoritario, su mando se corrompe en:", "o": ["Déspota, ególatra o terco", "Indolente o demagogo", "Persuasivo", "Cómplice"], "e": "Excederse de lo autoritario corrompe el mando en déspota, ególatra o terco.", "p": 134}, {"id": "m2-6", "m": "m2", "q": "¿Cuál es la cualidad más relevante del que manda, según el material?", "o": ["El amor a la responsabilidad", "La sangre fría ante el delito", "La superioridad de sus conocimientos", "La capacidad de delegar"], "e": "«El amor a la responsabilidad es la cualidad más relevante del que manda», sin llegar a resoluciones arbitrarias.", "p": 133}, {"id": "m2-7", "m": "m2", "q": "¿Cuál es «la base más segura de disciplina», sobre todo en caso de peligro?", "o": ["La mutua confianza entre jefe y subordinados", "El temor a la sanción", "La obediencia ciega a las órdenes", "La antigüedad del jefe"], "e": "La mutua confianza entre jefe y subordinados es la base más segura de disciplina.", "p": 133}, {"id": "m2-8", "m": "m2", "q": "El principio de conducción que se compara con la «sinergia» es:", "o": ["Unidad de comando", "Economía de fuerzas", "Masa", "Maniobra"], "e": "La unidad de comando obtiene la unidad del esfuerzo; equivale a la sinergia de la física.", "p": 136}, {"id": "m2-9", "m": "m2", "q": "El principio de conducción que busca evitar la «entropía» (pérdida de energía) es:", "o": ["Economía de fuerzas", "Unidad de comando", "Sorpresa", "Seguridad"], "e": "La economía de fuerzas implica el uso prudente del poder de acción con el mínimo empleo de medios, evitando la entropía.", "p": 136}, {"id": "m2-10", "m": "m2", "q": "El lema «Orden, Contraorden, Desorden» se asocia al principio de:", "o": ["Sencillez", "Seguridad", "Objetivo", "Ofensiva"], "e": "Principio de la sencillez: evitar lo complicado y superfluo para reducir malas interpretaciones.", "p": 137}, {"id": "m2-11", "m": "m2", "q": "La «aplicación concentrada de un poder de acción superior, en el momento y lugar oportunos, para un propósito decisivo» corresponde al principio de:", "o": ["Masa", "Maniobra", "Ofensiva", "Libertad de acción"], "e": "Es el principio de la masa, consecuencia del principio de economía de fuerzas.", "p": 136}, {"id": "m2-12", "m": "m2", "q": "Según el principio de la sorpresa, ¿qué es lo esencial?", "o": ["Que el oponente no tenga tiempo para tomar contramedidas", "Que el oponente sea tomado siempre de improviso", "Que se utilice la mayor cantidad de efectivos", "Que la acción se haga de noche"], "e": "No es esencial que el oponente sea tomado de improviso, sino que no tenga tiempo para tomar contramedidas.", "p": 136}, {"id": "m2-13", "m": "m2", "q": "El «conjunto de acciones, principalmente desplazamientos, para colocar las propias fuerzas en situación ventajosa» es el principio de:", "o": ["Maniobra", "Masa", "Sorpresa", "Seguridad"], "e": "La maniobra es la antítesis del estancamiento mental o de una posición física estática.", "p": 136}, {"id": "m2-14", "m": "m2", "q": "¿Cuál de estas NO es una actividad básica de la conducción según el material?", "o": ["Negociación", "Planeamiento", "Organización", "Coordinación"], "e": "Las actividades básicas son: planeamiento, organización, dirección, control y coordinación.", "p": 137}, {"id": "m2-15", "m": "m2", "q": "La coordinación, como actividad básica de la conducción, se ejecuta esencialmente en forma:", "o": ["Horizontal (entre pares e iguales)", "Vertical descendente", "Vertical ascendente", "Exclusivamente por el jefe máximo"], "e": "Su ejecución es esencialmente horizontal, siendo responsabilidad de todos favorecerla.", "p": 138}, {"id": "m2-16", "m": "m2", "q": "La técnica de la conducción se resume con la sigla AROS, que significa:", "o": ["Apreciación, Resolución y planes, Órdenes, Supervisión", "Análisis, Reunión, Organización, Seguimiento", "Apreciación, Reacción, Operación, Servicio", "Acción, Respuesta, Orden, Supervisión"], "e": "AROS: Apreciación – Resolución y Planes – Órdenes – Supervisión. Su orden no debe ser alterado.", "p": 138}, {"id": "m2-17", "m": "m2", "q": "El ejercicio de la conducción se resume con la sigla MATI, que significa:", "o": ["Misión, Asignación de medios, Tiempo, Información", "Mando, Autoridad, Táctica, Iniciativa", "Maniobra, Apoyo, Terreno, Inteligencia", "Misión, Apreciación, Técnica, Instrucción"], "e": "MATI: lo que debe incluirse al impartir órdenes a los subordinados.", "p": 139}, {"id": "m2-18", "m": "m2", "q": "La conducción que «señala los objetivos a lograr» es la:", "o": ["Conducción política", "Conducción estratégica", "Conducción táctica", "Conducción operacional"], "e": "Política: señala los objetivos; Estratégica: adecua los medios; Táctica: emplea los medios.", "p": 139}, {"id": "m2-19", "m": "m2", "q": "La conducción táctica:", "o": ["Emplea los medios para obtener los objetivos", "Señala los objetivos a lograr", "Adecua los medios para lograr los objetivos", "Fija la política de seguridad provincial"], "e": "Táctica = empleo de los medios; actúa a corto plazo y en un espacio menor.", "p": 140}, {"id": "m2-20", "m": "m2", "q": "Según el material, una «operación» policial es:", "o": ["El empleo extraordinario de fuerzas policiales para cumplir una misión determinada", "El empleo rutinario de fuerzas policiales", "Un conocimiento especial aplicado a una situación", "Un método obligatorio protocolizado"], "e": "Operación = empleo extraordinario (ej. control de disturbios); servicio = empleo rutinario (ej. patrullaje).", "p": 140}, {"id": "m2-21", "m": "m2", "q": "¿Cuál es un ejemplo de «servicio» policial?", "o": ["Patrullaje", "Negociación de rehenes", "Control de disturbios", "Protección de personalidades"], "e": "Servicio es el empleo rutinario: guardia, patrullaje, vigilancia.", "p": 140}, {"id": "m2-22", "m": "m2", "q": "Cuando un procedimiento está protocolizado (estandarizado), se lo llama:", "o": ["Procedimiento Operativo Normal (PON)", "Orden Preparatoria", "Orden de Operaciones", "Directiva"], "e": "Un procedimiento protocolizado se denomina PON.", "p": 140}, {"id": "m2-23", "m": "m2", "q": "El esposamiento, el desenfunde y el cacheo son ejemplos de:", "o": ["Técnicas", "Procedimientos", "Servicios", "Operaciones"], "e": "Técnica: conocimiento especial que se aplica en una situación determinada (forma exacta de realizar una acción).", "p": 140}, {"id": "m2-24", "m": "m2", "q": "En términos policiales, la «eficiencia» significa:", "o": ["Cumplir bien la misión con el menor desgaste o costo", "Hacer las cosas bien, sin importar el costo", "Cumplir la misión en el menor tiempo posible", "Usar la mayor cantidad de recursos disponibles"], "e": "Eficacia es «hacer las cosas bien»; eficiencia es «hacerlas bien con mínimo costo».", "p": 140}, {"id": "m2-25", "m": "m2", "q": "La diferencia entre reacción y respuesta es que:", "o": ["La reacción es instintiva y la respuesta es razonada", "La reacción es razonada y la respuesta es instintiva", "Ambas son instintivas", "La respuesta solo la da el jefe"], "e": "Reacción: acción instintiva ante un estímulo. Respuesta: acción razonada ante un estímulo.", "p": 140}, {"id": "m2-26", "m": "m2", "q": "Los tres requisitos esenciales de toda acción son que sea:", "o": ["Apta, factible y aceptable", "Rápida, segura y económica", "Legal, proporcional y necesaria", "Clara, precisa y oportuna"], "e": "Apta (coherente con los objetivos), factible (posibilidad de ejecución) y aceptable (consecuencias y costo-beneficio).", "p": 141}, {"id": "m2-27", "m": "m2", "q": "La pregunta «¿cuál es la relación costo-beneficio?» se vincula con el requisito de que la acción sea:", "o": ["Aceptable", "Apta", "Factible", "Oportuna"], "e": "Aceptable: ¿cuáles son las consecuencias? ¿en qué condiciones quedaremos? ¿relación costo-beneficio?", "p": 141}, {"id": "m2-28", "m": "m2", "q": "¿Cuáles son las grandes unidades según la terminología de organización policial?", "o": ["Unidad regional, dirección general, departamento y agrupación", "División, comisaría y batallón", "Subdivisión, subcomisaría y compañía", "Sección, grupo, destacamento y oficina"], "e": "Grandes unidades: UR, dirección general, departamento y agrupación (incluye la inspección de zona).", "p": 141}, {"id": "m2-29", "m": "m2", "q": "La división, la comisaría y el batallón son ejemplos de:", "o": ["Unidades", "Grandes unidades", "Subunidades", "Fracciones"], "e": "Unidad: agrupamiento orgánico mayor de una especialidad con cuadro de organización fijo.", "p": 141}, {"id": "m2-30", "m": "m2", "q": "La subdivisión, la subcomisaría y la compañía son:", "o": ["Subunidades", "Unidades", "Fracciones", "Grandes unidades"], "e": "Subunidad: agrupamiento orgánico menor de una especialidad.", "p": 141}, {"id": "m2-31", "m": "m2", "q": "¿Cuántos hombres componen un «grupo» según la organización policial?", "o": ["De 8 a 12 hombres, divididos en dos o tres equipos", "Menos de 8 hombres, en dos equipos", "De 2 a 3 parejas", "De 15 a 20 hombres"], "e": "El grupo tiene 8 a 12 hombres y está normalmente al mando de un oficial. El pelotón tiene menos de 8 y lo manda un suboficial.", "p": 143}, {"id": "m2-32", "m": "m2", "q": "El «pelotón» es:", "o": ["Un elemento no orgánico de menos de 8 hombres, al mando de un suboficial, de empleo circunstancial", "Un elemento orgánico de 8 a 12 hombres al mando de un oficial", "La base para la formación de la sección", "El equivalente de la compañía en caballería"], "e": "El pelotón no es base par
