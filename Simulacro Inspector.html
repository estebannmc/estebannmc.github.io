": ["Baja, media y alta", "Leve, grave y gravísima", "Disuasiva, defensiva y ofensiva", "Física, química y eléctrica"], "e": "La proporcionalidad depende sobre todo de la forma en que se aplica el medio.", "p": 296}, {"id": "m6-51", "m": "m6", "q": "El porte de cartucho en recámara, según el protocolo:", "o": ["Está limitado a situaciones excepcionales y debe justificarse documentalmente después", "Es obligatorio siempre en servicio", "Está prohibido en todos los casos", "Lo decide libremente cada agente sin justificar"], "e": "Ej.: riesgo inminente, zonas de alta peligrosidad, custodia de objetivos sensibles, agente aislado.", "p": 297}, {"id": "m6-52", "m": "m6", "q": "Según el protocolo, ¿qué es requisito previo para usar armamento de menor letalidad (art. 13)?", "o": ["Acreditar formación específica en su manejo", "Tener más de 10 años de servicio", "Contar con autorización judicial", "Ser oficial superior"], "e": "Art. 18: capacitación y actualización.", "p": 298}];

const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const LETTERS = ['A','B','C','D'];
const store = {
  get(k, d){ try{ const v = localStorage.getItem('simInsp:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('simInsp:'+k, JSON.stringify(v)); }catch(e){} }
};
let stats = store.get('stats', {});      // id -> {ok, ko}
let history = store.get('history', []);  // [{d, mode, ok, n}]
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

const byMod = {}; MODULES.forEach(m => byMod[m.id] = BANK.filter(q => q.m === m.id));
$('#bankMeta').innerHTML = `${BANK.length} preguntas<br>${MODULES.length} módulos`;

/* --------- configuración --------- */
const cfg = {
  tab: store.get('tab', 'exam'),
  counts: store.get('counts', null) || randomDist(),
  instant: store.get('instant', true),
  prefer: store.get('prefer', true),
  practiceMod: store.get('practiceMod', MODULES[0].id),
  practiceN: store.get('practiceN', '10'),
};
function randomDist(total=20){
  // entre 2 y 5 por módulo, suma = total
  const n = MODULES.length; let c;
  do { c = MODULES.map(() => 2 + Math.floor(Math.random()*4)); } while (c.reduce((a,b)=>a+b,0) !== total);
  const o = {}; MODULES.forEach((m,i) => o[m.id] = c[i]); return o;
}
function saveCfg(){ ['tab','counts','instant','prefer','practiceMod','practiceN'].forEach(k => store.set(k, cfg[k])); }

function pick(list, n){
  if (!cfg.prefer) return shuffle(list).slice(0, n);
  const w = q => { const s = stats[q.id]; let v = Math.random();
    if (!s) v += 1.2; else v += Math.min(s.ko,3)*0.6 - Math.min(s.ok,3)*0.35; return v; };
  return list.map(q => [w(q), q]).sort((a,b) => b[0]-a[0]).slice(0, n).map(x => x[1]);
}

/* --------- inicio --------- */
function renderHome(){
  const total = Object.values(cfg.counts).reduce((a,b)=>a+b,0);
  const seen = Object.keys(stats).length;
  app.innerHTML = `
  <section class="sheet" aria-labelledby="h-start">
    <div class="row" style="justify-content:space-between">
      <h2 id="h-start">Elegí cómo practicar</h2>
      <span class="label">${seen} de ${BANK.length} vistas</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-exam" aria-selected="${cfg.tab==='exam'}">Simulacro de examen</button>
      <button class="tab" role="tab" id="tab-mod" aria-selected="${cfg.tab==='mod'}">Practicar un módulo</button>
    </div>
    ${cfg.tab === 'exam' ? examPanel(total) : modPanel()}
    <div class="opts">
      <label class="check"><input type="checkbox" id="opt-instant" ${cfg.instant?'checked':''}> Corregir cada pregunta al instante</label>
      <label class="check"><input type="checkbox" id="opt-prefer" ${cfg.prefer?'checked':''}> Priorizar preguntas nuevas y erradas</label>
    </div>
  </section>
  ${historyPanel()}`;

  $('#tab-exam').onclick = () => { cfg.tab='exam'; saveCfg(); renderHome(); };
  $('#tab-mod').onclick = () => { cfg.tab='mod'; saveCfg(); renderHome(); };
  $('#opt-instant').onchange = e => { cfg.instant = e.target.checked; saveCfg(); };
  $('#opt-prefer').onchange = e => { cfg.prefer = e.target.checked; saveCfg(); };
  if (cfg.tab === 'exam'){
    app.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
      const id = b.dataset.id; cfg.counts[id] = Math.max(0, Math.min(byMod[id].length, cfg.counts[id] + (+b.dataset.step)));
      saveCfg(); renderHome(); $(`[data-id="${id}"][data-step="${b.dataset.step}"]`)?.focus();
    });
    $('#btn-rand').onclick = () => { cfg.counts = randomDist(); saveCfg(); renderHome(); };
    $('#btn-start').onclick = () => {
      let qs = []; MODULES.forEach(m => qs = qs.concat(pick(byMod[m.id], cfg.counts[m.id])));
      startQuiz(qs, 'Simulacro');
    };
  } else {
    app.querySelectorAll('input[name="pmod"]').forEach(r => r.onchange = () => { cfg.practiceMod = r.value; saveCfg(); });
    $('#sel-n').onchange = e => { cfg.practiceN = e.target.value; saveCfg(); };
    $('#btn-start').onclick = () => {
      const list = byMod[cfg.practiceMod]; const n = cfg.practiceN === 'all' ? list.length : Math.min(+cfg.practiceN, list.length);
      startQuiz(cfg.practiceN === 'all' ? shuffle(list) : pick(list, n), MODULES.find(m=>m.id===cfg.practiceMod).short);
    };
  }
  const clr = $('#btn-clear'); if (clr) clr.onclick = () => {
    if (clr.dataset.armed){ stats = {}; history = []; store.set('stats', stats); store.set('history', history); renderHome(); }
    else { clr.dataset.armed = '1'; clr.textContent = 'Tocá de nuevo para confirmar'; }
  };
}
function examPanel(total){
  return `
    <p class="lead">El examen suele tener 20 preguntas, con 2 a 5 de cada módulo. Ajustá cuántas querés de cada uno o sorteá una distribución nueva.</p>
    <div class="modlist">
      ${MODULES.map((m,i) => `
      <div class="modrow">
        <span class="code">M${i+1}</span>
        <span class="name">${esc(m.name)}<small>${byMod[m.id].length} preguntas en el banco</small></span>
        <span class="stepper" aria-label="Cantidad de ${esc(m.short)}">
          <button data-id="${m.id}" data-step="-1" aria-label="Menos" ${cfg.counts[m.id]<=0?'disabled':''}>−</button>
          <output aria-live="polite">${cfg.counts[m.id]}</output>
          <button data-id="${m.id}" data-step="1" aria-label="Más" ${cfg.counts[m.id]>=byMod[m.id].length?'disabled':''}>+</button>
        </span>
      </div>`).join('')}
    </div>
    <div class="totalbar">
      <span class="total">Total: <b>${total}</b> preguntas</span>
      <div class="row">
        <button class="btn ghost" id="btn-rand">Sortear 2–5 por módulo</button>
        <button class="btn" id="btn-start" ${total===0?'disabled':''}>Empezar</button>
      </div>
    </div>
    ${total!==20 && total>0 ? `<p class="warn">Ojo: el examen real suele tener 20; esta vez vas a responder ${total}.</p>` : ''}`;
}
function modPanel(){
  return `
    <p class="lead">Elegí un módulo para repasarlo a fondo.</p>
    <div class="modlist" role="radiogroup" aria-label="Módulo">
      ${MODULES.map((m,i) => {
        const ids = byMod[m.id].map(q=>q.id); const s = ids.filter(id => stats[id]);
        const ok = s.filter(id => stats[id].ok > 0 && stats[id].ko === 0).length;
        return `
      <label class="modrow" style="cursor:pointer">
        <span class="code">M${i+1}</span>
        <span class="name">${esc(m.name)}<small>${byMod[m.id].length} preguntas · ${s.length} vistas · ${ok} siempre bien</small></span>
        <input class="radio-mod" type="radio" name="pmod" value="${m.id}" id="pmod-${m.id}" ${cfg.practiceMod===m.id?'checked':''}>
      </label>`; }).join('')}
    </div>
    <div class="totalbar">
      <label class="check">Cantidad
        <select id="sel-n">
          ${['10','20','all'].map(v => `<option value="${v}" ${cfg.practiceN===v?'selected':''}>${v==='all'?'Todas':v}</option>`).join('')}
        </select>
      </label>
      <button class="btn" id="btn-start">Empezar</button>
    </div>`;
}
function historyPanel(){
  if (!history.length) return '';
  return `<section class="sheet" aria-labelledby="h-hist">
    <div class="row" style="justify-content:space-between"><h2 id="h-hist">Tus últimos intentos</h2>
    <button class="linkbtn" id="btn-clear">Borrar progreso</button></div>
    <div class="hist">${history.slice(-8).reverse().map(h => `<div><span>${esc(h.d)} · ${esc(h.mode)}</span><span>${h.ok}/${h.n} · ${Math.round(h.ok/h.n*100)}%</span></div>`).join('')}</div>
  </section>`;
}

/* --------- cuestionario --------- */
let run = null;
function startQuiz(qs, mode){
  run = { mode, i:0, t0: Date.now(), items: shuffle(qs).map(q => {
    const order = shuffle([0,1,2,3]); return { q, order, pick:null, checked:false };
  }) };
  if (mode === 'Simulacro') run.items.sort((a,b) => MODULES.findIndex(m=>m.id===a.q.m) - MODULES.findIndex(m=>m.id===b.q.m));
  renderQ();
}
function renderQ(){
  const it = run.items[run.i], q = it.q, n = run.items.length;
  const mod = MODULES.find(m => m.id === q.m);
  const done = it.checked || (!cfg.instant && it.pick !== null);
  app.innerHTML = `
  <section class="sheet" aria-live="polite">
    <div class="qhead">
      <div class="qnum">${run.i+1}<span> / ${n}</span></div>
      <div class="qmod">${esc(mod.short)}</div>
    </div>
    <div class="progress" style="--n:${n}">${run.items.map((x,j) => {
      let c = j===run.i ? 'cur' : (x.checked ? (x.pick===0?'ok':'ko') : (x.pick!==null?'ans':''));
      return `<i class="${c}"></i>`; }).join('')}</div>
    <p class="qtext">${esc(q.q)}</p>
    <ul class="choices">
      ${it.order.map((oi, k) => {
        let cls = '';
        if (it.checked){ if (oi===0) cls='right'; else if (oi===it.pick) cls='wrong'; }
        else if (oi===it.pick) cls='sel';
        return `<li><button class="choice ${cls}" data-oi="${oi}" ${it.checked?'disabled':''}><span class="bub">${LETTERS[k]}</span><span class="txt">${esc(q.o[oi])}</span></button></li>`;
      }).join('')}
    </ul>
    ${it.checked ? `<div class="fb ${it.pick===0?'':'ko'}">
        <strong>${it.pick===0 ? 'Correcto' : 'Incorrecto'}</strong>
        ${it.pick!==0 ? `<p>Respuesta correcta: <b>${esc(q.o[0])}</b></p>` : ''}
        <p>${esc(q.e)}</p>
        <span class="src">Apunte, pág. ${q.p}</span>
      </div>` : ''}
    <div class="navrow">
      <button class="btn ghost" id="btn-prev" ${run.i===0?'disabled':''}>Anterior</button>
      <span class="kbd">Teclas 1–4 o A–D · Enter</span>
      ${navBtn(it)}
    </div>
    <button class="linkbtn" id="btn-quit" style="align-self:flex-start">Abandonar y volver al inicio</button>
  </section>`;
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => choose(+b.dataset.oi));
  $('#btn-prev').onclick = () => { run.i--; renderQ(); };
  const nx = $('#btn-next'); if (nx) nx.onclick = next;
  $('#btn-quit').onclick = () => { const b = $('#btn-quit'); if (b.dataset.armed){ run=null; renderHome(); } else { b.dataset.armed='1'; b.textContent='Tocá de nuevo para abandonar (se pierde este intento)'; } };
}
function navBtn(it){
  const last = run.i === run.items.length-1;
  if (cfg.instant && !it.checked) return `<button class="btn" id="btn-next" ${it.pick===null?'disabled':''}>Corregir</button>`;
  if (!cfg.instant && it.pick===null) return `<button class="btn" id="btn-next" disabled>${last?'Terminar':'Siguiente'}</button>`;
  return `<button class="btn" id="btn-next">${last?'Ver resultado':'Siguiente'}</button>`;
}
function choose(oi){
  const it = run.items[run.i]; if (it.checked) return;
  it.pick = oi; renderQ();
}
function next(){
  const it = run.items[run.i];
  if (cfg.instant && !it.checked){ if (it.pick===null) return; it.checked = true; renderQ(); $('#btn-next')?.focus(); return; }
  if (run.i < run.items.length-1){ run.i++; renderQ(); }
  else finish();
}
document.addEventListener('keydown', e => {
  if (!run || e.target.tagName === 'SELECT' || e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key.toUpperCase(); let idx = -1;
  if ('1234'.includes(k) && k.length===1) idx = +k-1; else if ('ABCD'.includes(k) && k.length===1) idx = 'ABCD'.indexOf(k);
  if (idx >= 0){ const it = run.items[run.i]; if (!it.checked){ choose(it.order[idx]); } e.preventDefault(); }
  else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON'){ const b = $('#btn-next'); if (b && !b.disabled){ e.preventDefault(); b.click(); } }
});

/* --------- resultado --------- */
function finish(){
  run.items.forEach(it => { it.checked = true; const s = stats[it.q.id] || {ok:0,ko:0}; it.pick===0 ? s.ok++ : s.ko++; stats[it.q.id] = s; });
  store.set('stats', stats);
  const ok = run.items.filter(it => it.pick===0).length, n = run.items.length;
  const d = new Date(); const ds = d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  history.push({ d: ds, mode: run.mode, ok, n }); history = history.slice(-30); store.set('history', history);
  renderResult();
}
function renderResult(){
  const n = run.items.length, ok = run.items.filter(it => it.pick===0).length, pct = Math.round(ok/n*100);
  const mins = Math.max(1, Math.round((Date.now()-run.t0)/60000));
  const stamp = pct>=80 ? ['ok','Muy bien'] : pct>=60 ? ['mid','Vas bien'] : ['ko','A repasar'];
  const per = MODULES.map(m => { const its = run.items.filter(it => it.q.m===m.id); return { m, n: its.length, ok: its.filter(it=>it.pick===0).length }; }).filter(x => x.n);
  const wrong = run.items.filter(it => it.pick!==0);
  app.innerHTML = `
  <section class="sheet" aria-labelledby="h-res">
    <span class="label" id="h-res">Resultado · ${esc(run.mode)} · ${mins} min</span>
    <div class="score"><div class="big">${ok}<small>/${n}</small></div><div><span class="stamp ${stamp[0]}">${stamp[1]}</span><p class="label" style="margin-top:10px">${pct}% de respuestas correctas</p></div></div>
    <div class="bars">${per.map(x => { const p = x.ok/x.n; return `
      <div class="bar"><span class="bn">${esc(x.m.short)}</span><span class="bv">${x.ok}/${x.n}</span>
      <div class="track"><div class="fill ${p>=.8?'':p>=.6?'mid':'lo'}" style="width:${Math.max(p*100,2)}%"></div></div></div>`; }).join('')}</div>
    <div class="row">
      ${wrong.length ? `<button class="btn" id="btn-retry">Repasar las ${wrong.length} erradas</button>` : ''}
      <button class="btn ghost" id="btn-home">Volver al inicio</button>
    </div>
  </section>
  ${wrong.length ? `<section class="sheet" aria-labelledby="h-rev"><h2 id="h-rev">Para repasar</h2><div class="review">
    ${wrong.map(it => `<div class="ritem">
      <span class="label">${esc(MODULES.find(m=>m.id===it.q.m).short)} · pág. ${it.q.p}</span>
      <p class="rq">${esc(it.q.q)}</p>
      <p class="ra">Marcaste: <span class="x">${esc(it.q.o[it.pick])}</span></p>
      <p class="ra">Correcta: <span class="v">${esc(it.q.o[0])}</span></p>
      <p class="re">${esc(it.q.e)}</p></div>`).join('')}
  </div></section>` : `<section class="sheet"><p class="lead">No te equivocaste en ninguna. Probá con otra tanda o con un módulo completo.</p></section>`}`;
  $('#btn-home').onclick = () => { run = null; renderHome(); window.scrollTo(0,0); };
  const r = $('#btn-retry'); if (r) r.onclick = () => { startQuiz(wrong.map(it => it.q), 'Repaso de errores'); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

renderHome();
</script>

</body></html>
