a la formación de la sección; su empleo es circunstancial.", "p": 143}, {"id": "m2-33", "m": "m2", "q": "El equivalente de la «compañía» para elementos de caballería y perros se denomina:", "o": ["Escuadrón", "Tercio", "Batallón", "Brigada"], "e": "Para Comando Radioeléctrico y motorizada se llama «tercio»; para caballería y perros, «escuadrón».", "p": 142}, {"id": "m2-34", "m": "m2", "q": "El «puesto», como elemento de orden público, tiene:", "o": ["Funciones exclusivas de seguridad en un área geográfica asignada; puede ser fijo o móvil", "Funciones de policía de seguridad y judicial, con menos efectivos que la comisaría", "Funciones de control e inspección sobre las unidades de orden público", "Funciones de seguridad y excepcionalmente de policía judicial"], "e": "El destacamento tiene excepcionalmente funciones judiciales; el puesto, exclusivamente de seguridad.", "p": 142}, {"id": "m2-35", "m": "m2", "q": "Una comisaría «de distrito» corresponde a:", "o": ["Área rural", "Área urbana", "Área suburbana", "Área céntrica de la ciudad capital"], "e": "La comisaría puede ser seccional (urbana y/o suburbana) o de distrito (rural).", "p": 142}, {"id": "m2-36", "m": "m2", "q": "El Departamento (Personal, Informaciones, Operaciones, Logística, Judicial, Relaciones Policiales) tiene la responsabilidad de:", "o": ["Asesorar y asistir al Jefe de Policía, formando su órgano de conducción", "Ejecutar operaciones especiales en una región geográfica", "Controlar e inspeccionar comisarías de una zona", "Formar al personal en institutos de capacitación"], "e": "El Departamento es una gran unidad que forma, en esencia, el órgano de conducción del Jefe de Policía.", "p": 142}, {"id": "m2-37", "m": "m2", "q": "Según Goleman, la inteligencia emocional es:", "o": ["La capacidad de reconocer nuestros propios sentimientos y los de los demás, motivarnos y manejar adecuadamente las relaciones", "La capacidad exclusivamente cognitiva medida por el cociente intelectual", "La habilidad de imponer la propia voluntad al oponente", "La capacidad de controlar a los subordinados mediante el temor"], "e": "Engloba habilidades distintas –aunque complementarias– a la inteligencia académica.", "p": 146}, {"id": "m2-38", "m": "m2", "q": "¿Cuál de estas es una de las cuatro condiciones que debe reunir un buen líder?", "o": ["Compromiso con la misión", "Antigüedad en el cargo", "Dominio de técnicas de tiro", "Formación universitaria"], "e": "Las cuatro condiciones: compromiso con la misión, comunicación de la visión, confianza en sí mismo e integridad personal.", "p": 146}, {"id": "m2-39", "m": "m2", "q": "En el análisis FODA, ¿qué aspectos corresponden a la parte interna?", "o": ["Fortalezas y debilidades", "Oportunidades y amenazas", "Fortalezas y oportunidades", "Debilidades y amenazas"], "e": "La parte interna (con algún grado de control) son fortalezas y debilidades; la externa, oportunidades y amenazas.", "p": 150}, {"id": "m2-40", "m": "m2", "q": "En la Teoría de la Elección Racional, el «nudo de destino» es:", "o": ["Un punto de incertidumbre del que salen líneas que aluden a las acciones probables", "La decisión que hay que tomar en un momento determinado", "El resultado estimado para cada línea de acción", "El objetivo final de la organización"], "e": "Nudo de decisión = decisión a tomar; nudo de destino = punto de incertidumbre; resultados = estimados para cada línea.", "p": 151}, {"id": "m2-41", "m": "m2", "q": "La principal diferencia entre asertividad y empatía es que:", "o": ["La asertividad expresa algo nuestro hacia los demás; la empatía es un canal de afuera hacia adentro", "La empatía expresa nuestras opiniones de manera firme", "La asertividad implica no tener en cuenta a los demás", "Son sinónimos"], "e": "La conducta asertiva incluye la empatía, pero se diferencian en la dirección del canal.", "p": 152}, {"id": "m2-42", "m": "m2", "q": "¿Qué tipo de mandato determina objetivos amplios y da una amplia libertad de acción, empleado normalmente en los niveles superiores?", "o": ["Directiva", "Orden", "Orden preparatoria", "Procedimiento operativo normal"], "e": "Las órdenes proporcionan menor libertad de acción que las directivas o instrucciones.", "p": 153}, {"id": "m2-43", "m": "m2", "q": "Las órdenes «especiales» tratan sobre:", "o": ["Las operaciones (empleo anormal y extraordinario de fuerzas)", "Los servicios rutinarios", "Las licencias del personal", "Las circulares internas"], "e": "Las rutinarias tratan servicios; las especiales tratan operaciones.", "p": 153}, {"id": "m2-44", "m": "m2", "q": "El aviso preliminar de una orden o acción, para que los elementos dependientes realicen preparativos, es la:", "o": ["Orden Preparatoria (OP)", "Orden de Operaciones (OO)", "Directiva", "Instrucción"], "e": "La OP se imparte en forma breve y concisa, verbal o escrita.", "p": 153}, {"id": "m2-45", "m": "m2", "q": "La Orden de Operaciones (OO) se divide en:", "o": ["Encabezamiento, cuerpo y final", "Situación, misión y ejecución", "Introducción, desarrollo y conclusión", "Planeamiento, ejecución y control"], "e": "Tres partes principales: encabezamiento, cuerpo y final.", "p": 153}, {"id": "m2-46", "m": "m2", "q": "¿Cuáles son los cinco artículos del cuerpo de una Orden de Operaciones?", "o": ["Situación, Misión, Ejecución, SPAC, Comando y comunicaciones", "Misión, Medios, Tiempo, Información, Supervisión", "Apreciación, Resolución, Órdenes, Supervisión, Control", "Clima, Terreno, Oponente, Propia fuerza, Público"], "e": "Clima, terreno, oponente, propia fuerza y público son contenidos del artículo «Situación».", "p": 154}, {"id": "m2-47", "m": "m2", "q": "En el artículo «Ejecución» de una OO, el inciso de «Instrucciones de coordinación» es siempre el inciso:", "o": ["«x.»", "«a.»", "«1.»", "El último numerado"], "e": "Siempre será el inciso «x.», cualesquiera sean las letras de los incisos anteriores.", "p": 155}, {"id": "m2-48", "m": "m2", "q": "En la Orden de Operaciones, la sigla SPAC significa:", "o": ["Servicios Para Apoyo de la Conducción", "Sistema Policial de Atención Ciudadana", "Supervisión, Planeamiento, Apoyo y Control", "Servicio de Patrullaje Avanzado de Comando"], "e": "El SPAC responde al «CON QUÉ»: personal, logística, judicial y financiero.", "p": 155}, {"id": "m2-49", "m": "m2", "q": "En la OO, el original de la copia recibe el número:", "o": ["Uno", "Cero", "El número de la OO", "El que asigne el Jefe de Operaciones"], "e": "En el ángulo superior derecho se numeran las copias; el original recibe el número uno.", "p": 154}, {"id": "m2-50", "m": "m2", "q": "Al redactar la Misión en una OO, el «QUÉ» se define con:", "o": ["Un verbo en tiempo futuro", "Un verbo en infinitivo", "Un sustantivo", "Un verbo en pasado"], "e": "QUÉ: tarea, naturaleza básica de la operación, definida en un verbo en tiempo futuro.", "p": 155}, {"id": "m3-0", "m": "m3", "q": "¿Cuáles son los cuatro principios fundamentales de la seguridad de la información según el material?", "o": ["Confidencialidad, Integridad, Disponibilidad y Autenticidad", "Confidencialidad, Integridad, Disponibilidad y Legalidad", "Privacidad, Integridad, Respaldo y Autenticidad", "Confidencialidad, Cifrado, Disponibilidad y Auditoría"], "e": "Los cuatro principios clave: confidencialidad, integridad, disponibilidad y autenticidad.", "p": 159}, {"id": "m3-1", "m": "m3", "q": "El principio que asegura que la información solo esté accesible para personas autorizadas es:", "o": ["Confidencialidad", "Integridad", "Disponibilidad", "Autenticidad"], "e": "Se logra con contraseñas seguras, autenticación multifactor y encriptación.", "p": 159}, {"id": "m3-2", "m": "m3", "q": "Que los registros de pruebas se mantengan intactos para garantizar la validez de una investigación es un ejemplo de:", "o": ["Integridad", "Confidencialidad", "Disponibilidad", "Autenticidad"], "e": "Integridad: garantiza que la información no sea alterada de forma no autorizada.", "p": 159}, {"id": "m3-3", "m": "m3", "q": "Que una base de datos de antecedentes policiales esté disponible las 24 horas es un ejemplo de:", "o": ["Disponibilidad", "Integridad", "Confidencialidad", "Autenticidad"], "e": "Disponibilidad: la información debe estar accesible cuando sea necesaria.", "p": 159}, {"id": "m3-4", "m": "m3", "q": "Verificar que un correo con una orden judicial adjunta provenga realmente de un tribunal autorizado corresponde al principio de:", "o": ["Autenticidad", "Disponibilidad", "Integridad", "Confidencialidad"], "e": "Autenticidad: verifica que la fuente y el origen de la información sean legítimos, evitando suplantaciones.", "p": 159}, {"id": "m3-5", "m": "m3", "q": "¿Qué componentes forman la triada CID?", "o": ["Confidencialidad, Integridad y Disponibilidad", "Cifrado, Identidad y Datos", "Control, Integridad y Defensa", "Confidencialidad, Identificación y Disponibilidad"], "e": "La triada CID es el modelo conceptual de los pilares de la seguridad de la información.", "p": 161}, {"id": "m3-6", "m": "m3", "q": "Según la triada CID, un ataque de denegación de servicio (DoS) afecta principalmente a la:", "o": ["Disponibilidad", "Confidencialidad", "Integridad", "Autenticidad"], "e": "Phishing compromete la confidencialidad; malware altera la integridad; DoS afecta la disponibilidad.", "p": 161}, {"id": "m3-7", "m": "m3", "q": "Según el material, el phishing compromete principalmente la:", "o": ["Confidencialidad", "Disponibilidad", "Integridad", "Redundancia"], "e": "En la triada CID, el phishing se relaciona con la confidencialidad.", "p": 161}, {"id": "m3-8", "m": "m3", "q": "¿Cuál es la diferencia entre seguridad informática y seguridad de la información?", "o": ["La seguridad informática protege solo los sistemas tecnológicos; la de la información es integral e incluye procedimientos, documentos físicos y capacitación", "Son exactamente lo mismo", "La seguridad de la información solo protege documentos en papel", "La seguridad informática es más amplia que la de la información"], "e": "La seguridad de la información protege todos los aspectos de los datos, desde su creación hasta su eliminación.", "p": 161}, {"id": "m3-9", "m": "m3", "q": "Una debilidad en el sistema que puede ser explotada por una amenaza (por ejemplo, software desactualizado) es una:", "o": ["Vulnerabilidad", "Amenaza", "Riesgo", "Incidente"], "e": "Amenaza = evento que puede causar daño; vulnerabilidad = debilidad; riesgo = probabilidad de que la amenaza explote la vulnerabilidad.", "p": 161}, {"id": "m3-10", "m": "m3", "q": "El «riesgo», en seguridad de la información, es:", "o": ["La probabilidad de que una amenaza explote una vulnerabilidad y cause daño", "Una debilidad del sistema", "Cualquier persona que intenta acceder sin autorización", "Un software malicioso"], "e": "En el glosario: combinación de la probabilidad de ocurrencia de un evento y su impacto.", "p": 161}, {"id": "m3-11", "m": "m3", "q": "En el ejemplo policial, «el uso de contraseñas débiles por parte del personal» es:", "o": ["Una vulnerabilidad", "Una amenaza", "Un riesgo", "Un control"], "e": "La amenaza sería el atacante; la vulnerabilidad, las contraseñas débiles; el riesgo, la posible filtración.", "p": 162}, {"id": "m3-12", "m": "m3", "q": "¿Cuál de estos es un elemento de la seguridad FÍSICA?", "o": ["Monitoreo de temperatura y sistemas contra incendios", "Firewalls", "Cifrado de datos", "Autenticación multifactor"], "e": "Seguridad física: control de acceso físico, protección del entorno, condiciones ambientales y seguridad perimetral.", "p": 164}, {"id": "m3-13", "m": "m3", "q": "¿Cuál de estos es un riesgo común de la seguridad LÓGICA?", "o": ["Malware y ransomware", "Robo de equipos", "Inundaciones", "Acceso no autorizado a instalaciones"], "e": "Riesgos lógicos: phishing, robo de contraseñas, malware, ransomware y accesos desde redes externas.", "p": 164}, {"id": "m3-14", "m": "m3", "q": "Según el cuadro comparativo, los responsables de la seguridad física son:", "o": ["Personal de seguridad y mantenimiento", "Especialistas en TI y ciberseguridad", "Exclusivamente el jefe de la dependencia", "Los proveedores de software"], "e": "La seguridad lógica está a cargo de especialistas en TI y ciberseguridad.", "p": 165}, {"id": "m3-15", "m": "m3", "q": "¿Qué afirmación describe mejor al factor humano en la seguridad de la información?", "o": ["Puede ser tanto el eslabón más débil como el más fuerte", "Es siempre el eslabón más débil y no puede mejorarse", "No tiene incidencia si hay buena tecnología", "Solo importa en el área de sistemas"], "e": "Bien capacitado y concientizado, el personal pasa de eslabón más débil a principal activo de protección.", "p": 168}, {"id": "m3-16", "m": "m3", "q": "Un oficial deja abierta su sesión en un sistema sin supervisión y un intruso filtra datos. Esto ilustra:", "o": ["Un error humano que compromete la seguridad", "Una falla de seguridad física perimetral", "Un ataque de denegación de servicio", "Un problema de disponibilidad"], "e": "Es el «ejemplo real en el ámbito policial» de error humano y riesgo asociado.", "p": 167}, {"id": "m3-17", "m": "m3", "q": "Las Políticas de Seguridad de la Información (PSI) son:", "o": ["Documentos oficiales que definen normas, directrices y procedimientos para proteger la información", "Programas antivirus instalados en los equipos", "Auditorías externas obligatorias", "Contraseñas maestras de la institución"], "e": "Forman la base del enfoque organizacional hacia la seguridad de la información.", "p": 169}, {"id": "m3-18", "m": "m3", "q": "En el ejemplo práctico de política para un organismo público, ¿cada cuánto deben actualizarse las contraseñas?", "o": ["Cada 90 días", "Cada 30 días", "Cada 6 meses", "Una vez al año"], "e": "El ejemplo indica uso de MFA y actualización de contraseñas cada 90 días.", "p": 170}, {"id": "m3-19", "m": "m3", "q": "Según la política de clasificación de la información, los datos se clasifican como:", "o": ["Públicos, confidenciales o restringidos", "Secretos, reservados o libres", "Personales, laborales o judiciales", "Urgentes, normales o archivados"], "e": "Se limita el acceso a datos restringidos al personal autorizado.", "p": 170}, {"id": "m3-20", "m": "m3", "q": "El ciclo PDCA (Ciclo de Deming) utilizado en un SGSI significa:", "o": ["Planificar, Hacer, Verificar, Actuar", "Proteger, Detectar, Controlar, Auditar", "Prevenir, Diagnosticar, Corregir, Avisar", "Planificar, Diseñar, Comprobar, Archivar"], "e": "Es un modelo de mejora continua para mantener y mejorar el SGSI.", "p": 171}, {"id": "m3-21", "m": "m3", "q": "¿En qué etapa del ciclo PDCA se evalúa la eficacia del SGSI mediante auditorías internas y métricas?", "o": ["Verificar (Check)", "Planificar (Plan)", "Hacer (Do)", "Actuar (Act)"], "e": "En Actuar se toman medidas correctivas en base a los resultados de Verificar.", "p": 172}, {"id": "m3-22", "m": "m3", "q": "El estándar en que se basa un Sistema de Gestión de Seguridad de la Información (SGSI) es:", "o": ["ISO/IEC 27001", "ISO 9001", "ISO 14001", "IRAM 3501"], "e": "El material menciona la ISO/IEC 27001 como base del SGSI.", "p": 171}, {"id": "m3-23", "m": "m3", "q": "La relación entre política de seguridad y gestión de seguridad de la información es que:", "o": ["La política establece las normas y la gestión se ocupa de ejecutarlas y mantenerlas operativas", "La gestión establece las normas y la política las ejecuta", "Son independientes entre sí", "La política reemplaza a la gestión"], "e": "La política es una parte de la gestión; son complementarias.", "p": 173}, {"id": "m3-24", "m": "m3", "q": "Ante un incidente informático, ¿qué NO se debe hacer según el procedimiento inicial?", "o": ["Apagar el dispositivo afectado", "Desconectar el equipo comprometido de la red", "Cambiar contraseñas y bloquear cuentas sospechosas", "Informar al responsable de seguridad o superior jerárquico"], "e": "No apagar el dispositivo, ya que se podría eliminar evidencia importante.", "p": 175}, {"id": "m3-25", "m": "m3", "q": "¿Cuál es el paso 2 del procedimiento inicial ante un incidente informático?", "o": ["Aislar el problema", "Identificar el incidente", "Notificar a las autoridades competentes", "Registrar el incidente"], "e": "Pasos: 1) identificar, 2) aislar, 3) notificar, 4) evitar comprometer la evidencia, 5) registrar.", "p": 175}, {"id": "m3-26", "m": "m3", "q": "El último paso del procedimiento inicial ante un incidente es:", "o": ["Registrar el incidente completando un informe preliminar", "Formatear el equipo", "Apagar el equipo", "Instalar un nuevo antivirus"], "e": "Paso 5: completar un informe preliminar describiendo el incidente y las acciones tomadas.", "p": 175}, {"id": "m3-27", "m": "m3", "q": "Según el material, una contraseña robusta debe tener al menos:", "o": ["12 caracteres", "6 caracteres", "8 caracteres", "20 caracteres"], "e": "Longitud mínima de 12 caracteres, con mayúsculas, minúsculas, números y caracteres especiales.", "p": 178}, {"id": "m3-28", "m": "m3", "q": "El control de acceso en el que se asignan permisos según la función del usuario (ej. «investigador» vs. «prevención») es:", "o": ["Control de acceso basado en roles", "Control de acceso físico", "Control de acceso por contexto", "Autenticación biométrica"], "e": "Es eficiente porque simplifica la administración de permisos.", "p": 177}, {"id": "m3-29", "m": "m3", "q": "Si el sistema bloquea el acceso a una base de datos fuera del horario laboral aunque la contraseña sea correcta, se trata de:", "o": ["Acceso basado en el contexto", "Autenticación biométrica", "Control de acceso físico", "Autenticación de doble factor"], "e": "El acceso basado en el contexto depende del lugar, la hora o el dispositivo.", "p": 178}, {"id": "m3-30", "m": "m3", "q": "La autenticación multifactor (MFA) puede combinar:", "o": ["Algo que el usuario sabe, algo que tiene y algo que es", "Solo dos contraseñas distintas", "Usuario y contraseña", "Una contraseña y una pregunta secreta"], "e": "MFA: contraseña (sabe), token (tiene) y biometría (es).", "p": 179}, {"id": "m3-31", "m": "m3", "q": "La diferencia entre autenticación y autorización es que:", "o": ["La autenticación verifica la identidad; la autorización determina qué puede hacer o ver el usuario autenticado", "Son sinónimos", "La autorización verifica la identidad; la autenticación otorga permisos", "La autenticación solo se usa en dispositivos móviles"], "e": "Glosario: un asistente puede ver horarios pero no sueldos (autorización).", "p": 183}, {"id": "m3-32", "m": "m3", "q": "¿Qué herramienta se recomienda usar en redes Wi-Fi públicas para evitar filtraciones?", "o": ["VPN (Red Privada Virtual)", "Gestor de contraseñas", "BitLocker", "Antivirus"], "e": "Ejemplo accesible: ProtonVPN.", "p": 181}, {"id": "m3-33", "m": "m3", "q": "BitLocker es un ejemplo accesible de:", "o": ["Cifrado de datos", "Antivirus", "Gestor de contraseñas", "Autenticación multifactor"], "e": "Bitwarden = gestor de contraseñas; Google Authenticator = MFA; Windows Defender = antivirus.", "p": 181}, {"id": "m3-34", "m": "m3", "q": "La «ingeniería social» es:", "o": ["Una estrategia para manipular a las personas y obtener información confidencial", "Un software que registra pulsaciones del teclado", "Un ataque que sobrecarga una red", "La planificación de redes informáticas"], "e": "Ej.: alguien se hace pasar por el servicio técnico para obtener una contraseña.", "p": 184}, {"id": "m3-35", "m": "m3", "q": "Según los requisitos comunes de seguridad, el cifrado de datos debe proteger la información:", "o": ["Tanto en tránsito como en reposo", "Solo cuando se envía por la red", "Solo cuando se almacena", "Solo en dispositivos móviles"], "e": "En tránsito (por la red) y en reposo (almacenada).", "p": 177}, {"id": "m4-0", "m": "m4", "q": "El concepto de «legibilidad» designa:", "o": ["El grado de facilidad con el que se puede leer, comprender y memorizar un texto", "La calidad caligráfica de un escrito", "La corrección ortográfica de un texto", "La cantidad de palabras de un texto"], "e": "Se distingue la legibilidad tipográfica (percepción visual) de la lingüística (aspectos verbales).", "p": 187}, {"id": "m4-1", "m": "m4", "q": "La legibilidad que estudia la percepción visual del texto (tamaño de letra, contraste, forma) es la:", "o": ["Legibilidad tipográfica", "Legibilidad lingüística", "Legibilidad semántica", "Legibilidad sintáctica"], "e": "La lingüística trata aspectos verbales como la selección léxica o la longitud de la frase.", "p": 187}, {"id": "m4-2", "m": "m4", "q": "¿Cuál de estos rasgos corresponde a un texto de legibilidad ALTA?", "o": ["Palabras cortas y básicas, frases cortas y lenguaje concreto", "Subordinadas e incisos largos", "Poner las palabras importantes al final", "Enumeraciones excesivas y lenguaje abstracto"], "e": "Los tres primeros rasgos (palabras cortas, frases cortas, lenguaje concreto) son los más relevantes.", "p": 187}, {"id": "m4-3", "m": "m4", "q": "El Movimiento del Estilo Llano surgió a partir de:", "o": ["Las asociaciones de consumidores de EE.UU. en los años sesenta y setenta", "La Real Academia Española en los años veinte", "Los tribunales argentinos en los años noventa", "Las universidades europeas de posguerra"], "e": "Exigieron que leyes, contratos, seguros, etc. se escribieran en un estilo llano, asequible para todos.", "p": 188}, {"id": "m4-4", "m": "m4", "q": "Según el estilo llano, un escrito eficaz:", "o": ["Se puede entender la primera vez que se lee", "Debe releerse varias veces para captarse", "Usa terminología técnica siempre", "Coloca los datos relevantes al final"], "e": "«¡No te fíes de las relecturas!» La prosa llana tiene que captarse a la primera.", "p": 189}, {"id": "m4-5", "m": "m4", "q": "¿Cuáles son las tres dimensiones necesarias para escribir bien según el material?", "o": ["Conocimientos, habilidades y actitudes", "Gramática, ortografía y sintaxis", "Inventio, dispositio y elocutio", "Emisor, mensaje y receptor"], "e": "Las actitudes (¿me gusta escribir?, ¿por qué escribo?) están en la raíz del aprendizaje de la escritura.", "p": 190}, {"id": "m4-6", "m": "m4", "q": "Según la clasificación de Sebranek, Meyer y Kemper, la escritura cuyo objetivo es «comunicar, informar, estandarizar la comunicación» y que sigue fórmulas convencionales es la:", "o": ["Funcional", "Personal", "Creativa", "Persuasiva"], "e": "Ej.: correspondencia comercial, administrativa, cartas, contratos, facturas, solicitudes.", "p": 191}, {"id": "m4-7", "m": "m4", "q": "La escritura cuyo objetivo básico es «influir y modificar opiniones» es la:", "o": ["Persuasiva", "Expositiva", "Funcional", "Personal"], "e": "Ej.: editoriales, anuncios, eslóganes, panfletos, artículos de opinión, publicidad.", "p": 192}, {"id": "m4-8", "m": "m4", "q": "Los informes, noticias, normativas y manuales corresponden a la escritura:", "o": ["Expositiva", "Creativa", "Personal", "Persuasiva"], "e": "La expositiva busca explorar y presentar información, basada en hechos objetivos.", "p": 191}, {"id": "m4-9", "m": "m4", "q": "La guía para explorar el problema retórico propuesta por Flower (1989) se organiza en:", "o": ["Propósito, Audiencia, Autor y Escrito", "Introducción, Desarrollo y Conclusión", "Quién, Qué, Cuándo y Dónde", "Inventio, Dispositio, Elocutio y Memoria"], "e": "Preguntas sobre propósito, audiencia (receptor), autor (emisor) y escrito (mensaje).", "p": 192}, {"id": "m4-10", "m": "m4", "q": "La estructura estandarizada de una instancia (nota de solicitud) es:", "o": ["Identificación, expongo y solicito", "Cabecera, introducción, cuerpo y conclusión", "Planteamiento, nudo y desenlace", "Encabezamiento, cuerpo y final"], "e": "La carta tiene cabecera, introducción, cuerpo y conclusión; el cuento, planteamiento, nudo y desenlace.", "p": 193}, {"id": "m4-11", "m": "m4", "q": "Un párrafo se define como:", "o": ["Un conjunto de frases relacionadas que desarrollan un único tema", "Una sola oración que termina en punto y seguido", "El texto completo con título y punto final", "Un capítulo de un libro"], "e": "Es una unidad intermedia: superior a la oración e inferior al apartado o texto.", "p": 194}, {"id": "m4-12", "m": "m4", "q": "¿Cuál es el elemento más importante de la estructura interna de un párrafo?", "o": ["La primera frase, que introduce el tema o idea central", "La última frase", "Las frases del medio", "El título"], "e": "La primera frase es lo primero que se lee y debe introducir la idea central.", "p": 194}, {"id": "m4-13", "m": "m4", "q": "Los manuales de estilo periodístico recomiendan para un párrafo un máximo aproximado de:", "o": ["4 o 5 frases, 100 palabras o 20 líneas", "10 frases o 200 palabras", "2 frases o 30 palabras", "1 página"], "e": "Recomiendan brevedad con esos topes aproximados.", "p": 194}, {"id": "m4-14", "m": "m4", "q": "La falta llamada «párrafos frase» consiste en que:", "o": ["Cada párrafo consta de una sola frase, sin punto y seguido", "Se mezclan párrafos cortos y largos sin razón", "Ideas que deberían ir juntas aparecen separadas", "El párrafo no tiene sangría"], "e": "El desequilibrio es la mezcla anárquica de párrafos cortos y largos; las repeticiones y desórdenes separan ideas que van juntas.", "p": 194}, {"id": "m4-15", "m": "m4", "q": "Según la investigación psicolingüística, la capacidad media de la memoria a corto plazo es de:", "o": ["15 palabras", "5 palabras", "30 palabras", "50 palabras"], "e": "Con períodos largos e incisos extensos la memoria se sobrecarga y se pierde el hilo.", "p": 194}, {"id": "m4-16", "m": "m4", "q": "El libro de estilo de El País recomienda una media máxima de palabras por frase de:", "o": ["20 palabras", "10 palabras", "30 palabras", "40 palabras"], "e": "La Vanguardia también cita 20, pero descontando artículos y partículas gramaticales.", "p": 194}, {"id": "m4-17", "m": "m4", "q": "La frase «el agresor huyó siendo detenido horas después» es incorrecta porque usa un:", "o": ["Gerundio de posterioridad", "Verbo en voz pasiva refleja", "Inciso demasiado largo", "Adverbio mal ubicado"], "e": "Debería ser: «El agresor huyó y fue detenido horas después».", "p": 195}, {"id": "m4-18", "m": "m4", "q": "Según los ocho consejos para escribir frases eficientes, la información relevante debe ubicarse:", "o": ["Al principio de la frase", "Al final de la frase", "En un inciso", "Entre paréntesis"], "e": "Consejo 5: coloca la información relevante en el sitio más importante de la frase: al principio.", "p": 196}, {"id": "m4-19", "m": "m4", "q": "Según los consejos para escribir frases eficientes, hay que vigilar las frases que tengan más de:", "o": ["30 palabras", "15 palabras", "50 palabras", "10 palabras"], "e": "Consejo 1: ten cuidado con las frases largas; vigila las de más de 30 palabras.", "p": 196}, {"id": "m4-20", "m": "m4", "q": "En la jerarquía de los signos de puntuación, el punto y aparte corresponde a la unidad textual:", "o": ["Párrafo", "Texto", "Oración", "Inciso"], "e": "Punto final = texto; punto y aparte = párrafo; punto y seguido = oración.", "p": 197}, {"id": "m4-21", "m": "m4", "q": "El modelo lineal con cinco elementos de la comunicación (fuente, codificador, señal, decodificador y destino) fue conceptualizado por:", "o": ["Wilbur Schramm", "Gary Kreps", "Justo Villafañe", "Robert Eagleson"], "e": "Schramm fue pionero de la teoría de la comunicación.", "p": 198}, {"id": "m4-22", "m": "m4", "q": "Según el material, el método más eficaz de comunicación bidireccional es:", "o": ["Una conversación cara a cara entre dos personas", "Un comunicado de prensa", "Una publicación en redes sociales", "Una circular escrita"], "e": "Permite gestos, tonos de voz y retroalimentación inmediata.", "p": 199}, {"id": "m4-23", "m": "m4", "q": "Según los psicólogos citados, ¿qué porcentaje de lo que aprendemos procede de lo que vemos?", "o": ["83%", "11%", "50%", "95%"], "e": "El oído supone un 11%; por eso los oradores usan soportes visuales.", "p": 200}, {"id": "m4-24", "m": "m4", "q": "Los públicos que prestan atención al mensaje solo porque es entretenido y necesitan estilo y creatividad son los:", "o": ["Públicos pasivos", "Públicos activos", "Públicos internos", "Públicos objetivos"], "e": "Los activos ya están interesados y buscan información más sofisticada.", "p": 199}, {"id": "m4-25", "m": "m4", "q": "Según el material, las frases que reducen la comprensión del lector medio son las de más de:", "o": ["19 palabras", "10 palabras", "40 palabras", "25 palabras"], "e": "Las frases complejas y largas (más de 19 palabras) y las palabras con más sílabas reducen la comprensión.", "p": 200}, {"id": "m4-26", "m": "m4", "q": "Cuando la jerga se utiliza con el público en general, los sociólogos lo llaman:", "o": ["Ruido semántico", "Doble lenguaje", "Eufemismo", "Cliché"], "e": "La jerga interfiere con el mensaje y entorpece la comprensión.", "p": 201}, {"id": "m4-27", "m": "m4", "q": "Los mensajes que atraviesan todos los estratos de la organización sin respetar jerarquías (planteados por Justo Villafañe) son los:", "o": ["Transversales", "Horizontales", "Ascendentes", "Descendentes"], "e": "Buscan configurar un lenguaje común coherente con los valores de la organización.", "p": 202}, {"id": "m4-28", "m": "m4", "q": "Los mensajes que fluyen desde la cumbre de la pirámide jerárquica hacia niveles inferiores son:", "o": ["Descendentes", "Ascendentes", "Horizontales", "Transversales"], "e": "Para Kreps es el sistema de mensajes formales más básico.", "p": 202}, {"id": "m4-29", "m": "m4", "q": "Gary Kreps denomina a la comunicación informal como:", "o": ["La vía clandestina", "La red oficial", "El canal formal", "El circuito descendente"], "e": "En la comunicación informal cobra importancia la «red cultural» y el rumor.", "p": 203}, {"id": "m4-30", "m": "m4", "q": "En la comunicación interna, los principios de acción que se transmiten mediante el ejemplo y son la esencia de la cultura organizacional se llaman:", "o": ["Valores", "Misión", "Visión", "Objetivos"], "e": "La visión es el rumbo; la misión, la razón de ser; los valores, los principios de acción.", "p": 203}, {"id": "m4-31", "m": "m4", "q": "Según el material, ¿qué se debe evitar en la relación con la prensa?", "o": ["Los comentarios «off the record»", "Estar siempre disponibles", "Colaborar con las buenas y malas noticias", "Preparar al vocero o portavoz"], "e": "Principios: ser francos, no evasivos, no discriminar medios y evitar comentarios off the record.", "p": 204}, {"id": "m4-32", "m": "m4", "q": "Según el material, el conflicto es:", "o": ["El emergente de necesidades insatisfechas en una relación interpersonal", "Una situación neutra sin costos", "Algo que debe ocultarse siempre", "Exclusivo de organizaciones jerárquicas"], "e": "Se analiza en una dimensión estática (partes, posiciones, intereses) y una dinámica (proceso y contexto).", "p": 205}, {"id": "m4-33", "m": "m4", "q": "¿Qué enfoque de gestión de conflictos suele dar las soluciones más sostenibles y menos costosas a largo plazo?", "o": ["En base a los intereses", "En base al poder", "En base al derecho", "La evitación del conflicto"], "e": "Aunque culturalmente prevalecen el poder o el derecho, el enfoque basado en intereses promueve el diálogo.", "p": 206}, {"id": "m4-34", "m": "m4", "q": "¿Cuál de estos es un mecanismo orientado a la gestión de intereses?", "o": ["La mediación", "La sanción disciplinaria", "La imposición jerárquica", "El sumario administrativo"], "e": "Mecanismos: negociación colaborativa, conciliación, mediación y facilitación de consensos.", "p": 206}, {"id": "m4-35", "m": "m4", "q": "En la comunicación asertiva, «ser correcto» significa:", "o": ["Incluir todo lo que se tiene que decir, evitando verdades a medias o mentiras", "Evitar la agresividad", "Evitar ambigüedades", "No darle vueltas al asunto"], "e": "Ser claro = evitar ambigüedades; conciso = no darle vueltas; cortés = evitar la agresividad.", "p": 207}, {"id": "m4-36", "m": "m4", "q": "La oratoria se diferencia de otras formas verbales de comunicación por su objetivo de:", "o": ["Persuadir o influir en el otro", "Informar datos objetivos", "Entretener al público", "Describir hechos"], "e": "Es el género en prosa que busca convencer, persuadir o conmover mediante la palabra hablada.", "p": 207}, {"id": "m4-37", "m": "m4", "q": "El discurso cuya estructura es introducción, desarrollo y resumen, y que busca explicar una idea de forma clara y objetiva es el:", "o": ["Expositivo", "Argumentativo", "Narrativo", "Publicitario"], "e": "El argumentativo busca convencer y es más subjetivo.", "p": 209}, {"id": "m4-38", "m": "m4", "q": "En la construcción retórica de un discurso, la fase que trata sobre el orden y la disposición de las ideas es la:", "o": ["Dispositio", "Inventio", "Elocutio", "Memoria"], "e": "Inventio = qué decir; Dispositio = orden; Elocutio = expresión; Actio = puesta en escena; Memoria = recordar.", "p": 209}, {"id": "m4-39", "m": "m4", "q": "De las cinco fases de la retórica, ¿cuáles son las tres esenciales?", "o": ["Inventio, dispositio y elocutio", "Actio, memoria e inventio", "Elocutio, actio y memoria", "Dispositio, actio y memoria"], "e": "Las dos posteriores (actio y memoria) son de género pragmático: cuando el discurso se pronuncia.", "p": 210}, {"id": "m4-40", "m": "m4", "q": "¿Cuál de estos es uno de los cuatro principios éticos clave de la comunicación?", "o": ["Elegir el momento y el lugar adecuados para contar nuestra historia", "Usar siempre jerga técnica", "Comunicar aunque no esté verificado", "Priorizar mensajes sensacionalistas"], "e": "Los cuatro: transparencia y honestidad; entender y escuchar al público; respetar confidencialidad y privacidad; elegir momento y lugar.", "p": 211}, {"id": "m4-41", "m": "m4", "q": "Según el principio de transparencia, se considera poco ético incluso si es falso:", "o": ["Un 1% de lo que digamos", "Más del 10% de lo que digamos", "La mitad del mensaje", "Solo si fue intencional"], "e": "Aunque no haya sido nuestra intención, es poco ético si un 1% de lo dicho es falso.", "p": 210}, {"id": "m5-0", "m": "m5", "q": "La Ley del Personal Policial 12.521 fue dictada en el año 2006 y derogó la:", "o": ["Ley 6769", "Ley 7395", "Ley 11.516", "Ley 12.333"], "e": "Entre sus cambios: cuadro único en la escala jerárquica, régimen de responsabilidad policial y régimen de ascensos y concursos.", "p": 213}, {"id": "m5-1", "m": "m5", "q": "La superioridad policial puede darse en razón de:", "o": ["Grado jerárquico, antigüedad en el mismo y cargo que desempeña", "Edad, título y destino", "Grado, sueldo y destino", "Escalafón, especialidad y edad"], "e": "Superioridad jerárquica, por antigüedad y por cargo.", "p": 213}, {"id": "m5-2", "m": "m5", "q": "¿Qué tipo de superioridad impone al subordinado la obligación de cumplir órdenes del superior?", "o": ["Superioridad por cargo", "Superioridad por antigüedad", "Superioridad jerárquica", "Superioridad moral"], "e": "La superioridad por cargo resulta de la dependencia orgánica dentro de un mismo organismo o unidad.", "p": 213}, {"id": "m5-3", "m": "m5", "q": "El «estado policial» es:", "o": ["La situación jurídica que resulta del conjunto de obligaciones y prerrogativas establecidos por leyes y decretos para el personal de todos los escalafones", "La condición de portar arma en todo momento", "El grado jerárquico alcanzado", "El destino asignado al personal"], "e": "Definición de estado policial según el material.", "p": 213}, {"id": "m5-4", "m": "m5", "q": "En caso de renuncia, el personal policial debe seguir desempeñando sus funciones hasta un término de:", "o": ["30 días, si antes no fuera reemplazado o aceptada su dimisión", "10 días", "60 días", "90 días"], "e": "De no hacerlo incurre en abandono de servicio y en el delito de incumplimiento de obligaciones de funcionario policial.", "p": 214}, {"id": "m5-5", "m": "m5", "q": "¿Qué escalafón es el ÚNICO investido de autoridad policial según el art. 25 de la LPP?", "o": ["Escalafón General", "Escalafón Profesional", "Escalafón Técnico", "Escalafón Servicios"], "e": "El personal del Escalafón General es el único investido de autoridad policial.", "p": 215}, {"id": "m5-6", "m": "m5", "q": "Según el art. 29 de la LPP, el personal con autoridad policial está obligado a portar arma de fuego:", "o": ["Durante el tiempo de prestación del servicio", "En todo lugar y circunstancia", "Solo en operativos especiales", "Nunca, queda a criterio del superior"], "e": "El régimen anterior exigía portarla siempre; hoy, franco de servicio queda a criterio del empleado.", "p": 215}, {"id": "m5-7", "m": "m5", "q": "El Decreto Reglamentario 461/15 establece que el superior que constata una falta y no actúa en consecuencia:", "o": ["Incurre en falta grave (art. 43 inc. e) y k) Ley 12.521)", "No comete falta alguna", "Incurre en falta leve", "Solo recibe un llamado de atención verbal"], "e": "No sancionar es una falta administrativa; en sanción directa, la omisión de actuar es falta grave.", "p": 214}, {"id": "m5-8", "m": "m5", "q": "La Ley Orgánica de la Policía de la Provincia de Santa Fe es la:", "o": ["Ley 7395 (y modif. Ley 11.516)", "Ley 12.521", "Ley 12.333", "Ley 14.428"], "e": "La 12.521 es la Ley del Personal Policial; la 12.333 crea el I.Se.P.", "p": 216}, {"id": "m5-9", "m": "m5", "q": "Según el art. 54 de la Ley Orgánica, la Policía Provincial se organiza como un cuerpo:", "o": ["Centralizado en lo administrativo y descentralizado en lo funcional", "Descentralizado en lo administrativo y centralizado en lo funcional", "Totalmente descentralizado", "Totalmente centralizado"], "e": "El Jefe de Policía conduce operativa y administrativamente la institución (art. 27).", "p": 217}, {"id": "m5-10", "m": "m5", "q": "¿Cuántos Departamentos integran la Plana Mayor Policial?", "o": ["Cinco", "Tres", "Cuatro", "Seis"], "e": "D-1 Personal, D-2 Informaciones, D-3 Operaciones, D-4 Logística, D-5 Judicial.", "p": 218}, {"id": "m5-11", "m": "m5", "q": "¿Qué Departamento de la Plana Mayor realiza tareas de inteligencia y su reglamento tiene carácter «Reservado»?", "o": ["D-2 Informaciones", "D-1 Personal", "D-3 Operaciones", "D-5 Judicial"], "e": "El Reglamento del Departamento de Informaciones Policiales (R.D.I.P.) tiene carácter reservado.", "p": 218}, {"id": "m5-12", "m": "m5", "q": "El Departamento que compila e informa antecedentes judiciales y contravencionales de personas es el:", "o": ["D-5 Judicial", "D-2 Informaciones", "D-1 Personal", "D-4 Logística"], "e": "También da apoyo técnico en rastros, pericias y documentación gráfica de la prueba.", "p": 218}, {"id": "m5-13", "m": "m5", "q": "El régimen disciplinario, las calificaciones, licencias y cambios de destino son competencia del:", "o": ["D-1 Personal", "D-3 Operaciones", "D-4 Logística", "D-5 Judicial"], "e": "El D-1 se ocupa de los integrantes de la policía como individuos.", "p": 218}, {"id": "m5-14", "m": "m5", "q": "La Jefatura de la Plana Mayor Policial es ejercida por:", "o": ["Un Director General de Policía del escalafón seguridad", "El Subjefe de Policía", "El Ministro de Seguridad", "Un Comisario Supervisor"], "e": "Así lo establece la Ley Orgánica.", "p": 217}, {"id": "m5-15", "m": "m5", "q": "El Instituto de Seguridad Pública (I.Se.P.) fue creado por la:", "o": ["Ley 12.333/2004", "Ley 12.521/2006", "Ley 7395", "Decreto 1166/2018"], "e": "Es una persona de derecho público autárquica.", "p": 219}, {"id": "m5-16", "m": "m5", "q": "¿Qué carreras terciarias se crean en el ámbito del I.Se.P. por la Ley 12.333?", "o": ["Auxiliar en Seguridad y Técnico Superior en Seguridad", "Licenciatura en Seguridad y Criminalística", "Oficial de Policía y Suboficial", "Técnico en Investigaciones y Perito"], "e": "Los títulos se otorgan aprobados los exámenes, sin promoción automática por el solo cursado.", "p": 219}, {"id": "m5-17", "m": "m5", "q": "¿Qué escuela del I.Se.P. tiene como objetivo la formación de las jerarquías de Suboficial, Oficial, Subinspector e Inspector?", "o": ["Escuela de Especialidades en Seguridad", "Escuela Superior de Seguridad Pública", "Escuela de Policía", "Escuela de Investigaciones"], "e": "La Escuela Superior agrupa a Subcomisario, Comisario, Comisario Supervisor, Subdirector y Director.", "p": 220}, {"id": "m5-18", "m": "m5", "q": "Según los arts. 73-74 de la LPP, los ascensos del personal policial se rigen por el principio constitucional de:", "o": ["Idoneidad", "Antigüedad", "Igualdad salarial", "Mérito político"], "e": "Se producen por decreto del Poder Ejecutivo, grado a grado y por sistema de concursos.", "p": 220}, {"id": "m5-19", "m": "m5", "q": "El concurso para ascensos es:", "o": ["Público, de antecedentes y oposición, convocado anualmente", "Solo de antecedentes, cada dos años", "Interno y solo de oposición", "Por sorteo entre los aspirantes"], "e": "Anualmente se llama a concurso público de antecedentes y oposición.", "p": 220}, {"id": "m5-20", "m": "m5", "q": "Según el Decreto 1166/18, las actividades de los Jurados de concurso deben iniciarse a partir del:", "o": ["1° de septiembre de cada año", "1° de marzo de cada año", "1° de enero de cada año", "1° de diciembre de cada año"], "e": "El Ministro de Seguridad dicta anualmente las resoluciones de llamado a concurso.", "p": 221}, {"id": "m5-21", "m": "m5", "q": "Los ascensos extraordinarios deben estar siempre relacionados con:", "o": ["Un acto de arrojo en funciones, con grave y real riesgo, en defensa de la vida, bienes y derechos de las personas", "La antigüedad en el grado", "Un excelente promedio en los cursos", "La propuesta del jefe directo"], "e": "No están sujetos a los requisitos generales de los ascensos ordinarios.", "p": 221}, {"id": "m5-22", "m": "m5", "q": "El listado de personal inhabilitado para concursar debe publicarse:", "o": ["Por 5 días, con antelación mínima de 10 días al comienzo de la inscripción", "Por 10 días, con 5 días de antelación", "Por 3 días, el mismo día de la inscripción", "Por 30 días"], "e": "El afectado puede interponer recurso directo ante el Poder Ejecutivo dentro de los 3 días hábiles siguientes a la última publicación.", "p": 222}, {"id": "m5-23", "m": "m5", "q": "Según el Decreto 1166/18, a efectos de inhabilidad, el «auto de procesamiento» se asimila a:", "o": ["La audiencia imputativa del art. 274 del Código Procesal Penal (Ley 12.734)", "La condena firme", "La denuncia penal", "La declaración indagatoria federal"], "e": "Inciso c) de las inhabilidades reglamentadas.", "p": 223}, {"id": "m5-24", "m": "m5", "q": "¿Cuántos años se revisan para determinar si una suspensión de empleo inhabilita para concursar?", "o": ["Los dos años inmediatos anteriores al de los ascensos", "Solo el año en curso", "Los últimos cinco años", "Toda la carrera"], "e": "El año del concurso refiere al inmediato anterior al de los ascensos.", "p": 223}, {"id": "m5-25", "m": "m5", "q": "El personal bajo sumario administrativo no resuelto:", "o": ["Puede participar del concurso, pero su propuesta de ascenso queda en suspenso hasta la conclusión del sumario", "No puede inscribirse en el concurso", "Asciende automáticamente si aprueba", "Debe esperar dos años para concursar"], "e": "Si el sumario termina en suspensión por falta grave o destitución, no corresponde el ascenso.", "p": 223}, {"id": "m5-26", "m": "m5", "q": "Pasar a prestar servicios en otra dependencia por tiempo determinado, con obligación de reintegrarse a la de origen, se denomina:", "o": ["Adscripción", "Traslado", "Rotación interna", "Cambio de destino"], "e": "El cambio de destino es por tiempo indeterminado; el traslado es a otra localidad.", "p": 224}, {"id": "m5-27", "m": "m5", "q": "La permanencia máxima en adscripción es de:", "o": ["60 días por funcionario y por año calendario", "30 días por año", "90 días por año", "6 meses"], "e": "Art. 70 del R.R.C.D.; en organismos del gobierno provincial, más de 90 días requiere decreto.", "p": 224}, {"id": "m5-28", "m": "m5", "q": "El cambio de oficina o actividad dentro de la misma dependencia se denomina:", "o": ["Rotación interna", "Adscripción", "Traslado", "Disponibilidad"], "e": "Se dispone por el Jefe de Unidad o Sección mediante «orden interna».", "p": 224}, {"id": "m5-29", "m": "m5", "q": "Según el art. 80 de la LPP, el permiso exime al empleado de sus obligaciones por un lapso de hasta:", "o": ["2 días por mes y 6 días en el año", "3 días por mes y 10 días en el año", "1 día por mes y 12 en el año", "5 días por mes y 15 en el año"], "e": "Por cualquier razón atendible a juicio del concedente y no contemplada expresamente.", "p": 225}, {"id": "m5-30", "m": "m5", "q": "Las compensaciones por horas trabajadas en ampliación horaria se incrementan cuando son nocturnas, de fin de semana o feriados en un:", "o": ["20%", "50%", "10%", "100%"], "e": "Las autoriza el jefe de la dependencia policial.", "p": 225}, {"id": "m5-31", "m": "m5", "q": "¿Desde qué momento tiene derecho el personal a la licencia anual ordinaria?", "o": ["Desde que alcanza 6 meses desde su ingreso", "Desde el primer día", "Desde que cumple 1 año", "Desde que cumple 2 años"], "e": "Art. 81 de la LPP.", "p": 226}, {"id": "m5-32", "m": "m5", "q": "Con 10 años de antigüedad, ¿cuántos días de licencia anual ordinaria corresponden según la escala del art. 82 de la LPP?", "o": ["25 días", "19 días", "35 días", "30 días"], "e": "6 meses a 5 años: 19 días; 5 a 15 años: 25 días; más de 15 años: 35 días (hábiles, más 5 corridos para el escalafón general).", "p": 226}, {"id": "m5-33", "m": "m5", "q": "La licencia anual ordinaria puede fraccionarse en:", "o": ["Dos fracciones, ninguna inferior a 7 días", "Tres fracciones de 5 días mínimo", "Cuatro fracciones libres", "No puede fraccionarse"], "e": "Puede usarse en forma continuada o en dos fracciones.", "p": 226}, {"id": "m5-34", "m": "m5", "q": "La licencia extraordinaria (art. 84 LPP) se otorga:", "o": ["Una sola vez en la carrera, a quien tenga más de 25 años de servicio, por 90 días", "Cada 5 años, por 30 días", "Al personal con más de 10 años, por 60 días", "Una vez por año, por 15 días"], "e": "La solicitud de pase a retiro determina su cese.", "p": 226}, {"id": "m5-35", "m": "m5", "q": "Para hacer uso de la licencia excepcional, el personal debe contar con una antigüedad no menor a:", "o": ["10 años", "5 años", "15 años", "25 años"], "e": "Además debe ofrecer las pruebas de las causas que la motiven.", "p": 227}, {"id": "m5-36", "m": "m5", "q": "La licencia por violencia de género (Ley provincial 13.696) se otorga por:", "o": ["3 días hábiles con goce de sueldo, sin requerir antigüedad mínima", "10 días corridos sin goce de sueldo", "30 días con goce de sueldo", "5 días hábiles con 1 año de antigüedad"], "e": "Incluye a quienes acrediten la rectificación registral del sexo conforme a la Ley 26.743.", "p": 227}, {"id": "m5-37", "m": "m5", "q": "A los candidatos políticos de listas oficializadas se les otorga licencia por:", "o": ["30 días corridos anteriores al acto electoral, con goce de haberes", "15 días sin goce de haberes", "Todo el período de campaña sin goce de haberes", "60 días con goce de haberes"], "e": "Si es electo, la licencia por el cargo es sin percepción de haberes.", "p": 227}, {"id": "m5-38", "m": "m5", "q": "La licencia para el otro progenitor o guardador por nacimiento de hijo es de:", "o": ["8 días corridos", "3 días hábiles", "15 días corridos", "30 días"], "e": "Decreto 2959/16.", "p": 227}, {"id": "m5-39", "m": "m5", "q": "La licencia por maternidad se extiende hasta que el recién nacido cumpla:", "o": ["Tres meses de vida (seis meses en casos de nacimientos múltiples, pretérminos o con capacidades diferentes)", "Un mes de vida", "Un año de vida", "45 días de vida"], "e": "La licencia preparto se toma con antelación no mayor a 45 días de la fecha probable de parto.", "p": 227}, {"id": "m5-40", "m": "m5", "q": "¿Cuáles son las tres vías por las que se sustancian las actuaciones disciplinarias en el ámbito policial?", "o": ["Sumario administrativo, información sumaria y sanción directa por falta leve", "Denuncia, juicio y apelación", "Investigación penal, juicio oral y casación", "Sumario, juicio político y destitución"], "e": "Supletoriamente se aplica el Reglamento de Trámite de Actuaciones Administrativas (Ley 14.428).", "p": 229}, {"id": "m5-41", "m": "m5", "q": "Según el Decreto 461/15, se considera «tardanza» la demora injustificada en la toma de servicio de más de:", "o": ["5 minutos", "10 minutos", "15 minutos", "30 minutos"], "e": "La tardanza o inasistencia injustificada de hasta 72 horas es falta leve (art. 41 inc. c).", "p": 230}, {"id": "m5-42", "m": "m5", "q": "¿Cuántas faltas leves concurrentes implican una falta grave (art. 42)?", "o": ["3", "2", "5", "4"], "e": "El concurso de 3 faltas leves implica falta grave.", "p": 233}, {"id": "m5-43", "m": "m5", "q": "Las inasistencias injustificadas que constituyen falta grave (art. 43 inc. f) son las de:", "o": ["4 o más días corridos o alternados en el término de 10 días, en el año calendario", "2 días corridos en el mes", "3 días alternados en el año", "10 días corridos en el año"], "e": "Con descuento de haberes.", "p": 237}, {"id": "m5-44", "m": "m5", "q": "Un daño a bienes del Estado se tipifica como falta GRAVE cuando su costo supera:", "o": ["El 50% del haber neto del cargo de Suboficial sin antigüedad", "El 100% del sueldo del infractor", "El 10% del haber de un Comisario", "Cualquier monto"], "e": "Si es inferior al 50%, es falta leve.", "p": 233}, {"id": "m5-45", "m": "m5", "q": "¿Cuál de estas conductas es FALTA GRAVE según el Decreto 461/15?", "o": ["Dormirse en servicio", "Fumar en horario de servicio", "No saludar al superior", "Usar indebidamente el celular en servicio"], "e": "Las otras tres son faltas leves.", "p": 233}, {"id": "m5-46", "m": "m5", "q": "Fumar en horarios de servicio, dentro o fuera de las dependencias o móviles, constituye:", "o": ["Falta leve", "Falta grave", "Delito", "No es falta"], "e": "Art. 41 inc. d) — prestar servicios con falta de seriedad o diligencia.", "p": 231}, {"id": "m5-47", "m": "m5", "q": "No comunicar dentro de cierto plazo una resolución judicial o administrativa que modifique su situación de revista es falta leve. ¿Cuál es ese plazo?", "o": ["3 días de notificada", "24 horas", "10 días", "30 días"], "e": "Art. 41 inc. g).", "p": 232}, {"id": "m5-48", "m": "m5", "q": "Consumir en acto de servicio o inmediatamente antes sustancias ILEGALES es:", "o": ["Falta grave", "Falta leve", "Falta leve agravada solo si hay daño", "No es falta si no hay daño"], "e": "Si la sustancia es ilegal se considera falta grave en todos los casos.", "p": 232}, {"id": "m5-49", "m": "m5", "q": "Participar con uniforme policial en actividades proselitistas de partidos políticos es:", "o": ["Falta grave", "Falta leve", "Un derecho del personal", "Solo una recomendación"], "e": "Art. 43 inc. a), punto 21 del Decreto 461/15.", "p": 235}, {"id": "m5-50", "m": "m5", "q": "La norma de forma específica para la instrucción de sumarios administrativos policiales es el:", "o": ["Reglamento para Sumarios Administrativos (Decreto 4055/77)", "Decreto 461/15", "Código Procesal Penal", "Decreto 4413/79"], "e": "La Ley 14.428 se aplica supletoriamente; la Ley 12.521 es la norma de fondo.", "p": 241}, {"id": "m5-51", "m": "m5", "q": "Según el art. 37 del RSA, ¿cuál de estos casos obliga a instruir sumario administrativo?", "o": ["Invalidez o fallecimiento del personal en actos del servicio", "Una tardanza de 10 minutos", "Un daño patrimonial menor al 50% del haber de Suboficial", "La primera falta leve del agente"], "e": "También: faltas graves, autor no determinado, daño patrimonial relevante y auto de procesamiento firme.", "p": 242}, {"id": "m5-52", "m": "m5", "q": "La audiencia del art. 40 del RSA (audiencia imputativa) es aquella en la que:", "o": ["El instructor emplaza al imputado y le recibe declaración sobre los hechos que se le atribuyen; su omisión conlleva nulidad", "Se dicta la sanción definitiva", "Se recibe la declaración de los testigos", "Se resuelven los recursos"], "e": "La incomparecencia injustificada habilita la declaración de rebeldía.", "p": 245}, {"id": "m5-53", "m": "m5", "q": "Si el imputado en un sumario es Inspector General, ¿quién instruye el sumario?", "o": ["El Subjefe de Policía", "El Jefe de Unidad Regional", "Un Comisario", "El Ministro de Seguridad"], "e": "Regla de competencia del instructor.", "p": 243}, {"id": "m5-54", "m": "m5", "q": "El instructor de un sumario debe ser:", "o": ["Oficial del Cuerpo de Seguridad, superior en grado al sumariado", "De igual jerarquía que el sumariado en todos los casos", "Un abogado externo", "El jefe directo del sumariado siempre"], "e": "Con personal en retiro puede ser de igual jerarquía.", "p": 243}, {"id": "m5-55", "m": "m5", "q": "¿Cuál es una causal de recusación del instructor?", "o": ["Parentesco hasta 4° grado de consanguinidad o 2° de afinidad con el denunciante o sumariado", "Tener menor antigüedad que el sumariado", "Prestar servicio en otra Unidad Regional", "Haber instruido otros sumarios"], "e": "También: amistad íntima, enemistad manifiesta, interés, causa pendiente, haber sido denunciado por el imputado.", "p": 244}, {"id": "m5-56", "m": "m5", "q": "En el sumario administrativo, las vistas y traslados se confieren por:", "o": ["5 días hábiles", "3 días corridos", "10 días hábiles", "24 horas"], "e": "Los términos se computan en días hábiles administrativos.", "p": 245}, {"id": "m5-57", "m": "m5", "q": "La información sumaria debe concluirse con informe fundado dentro del plazo de:", "o": ["10 días", "30 días", "5 días", "60 días"], "e": "Si surge que el caso requiere sumario, se abre conservando la validez de lo actuado.", "p": 246}, {"id": "m5-58", "m": "m5", "q": "Como criterio operativo para confirmar la reincidencia, el lapso entre la primera y la última falta es de:", "o": ["6 meses", "1 año", "2 años", "3 meses"], "e": "Cuando corresponda sanción directa puede aplicarse suspensión de empleo de 1 a 5 días (art. 57).", "p": 247}, {"id": "m5-59", "m": "m5", "q": "En el procedimiento de sanción directa (Res. 2372/23), verificada la falta, el superior debe convocar al agente para su descargo dentro de:", "o": ["24 horas", "48 horas", "72 horas", "5 días"], "e": "En el mismo lapso recaba los antecedentes disciplinarios.", "p": 248}, {"id": "m5-60", "m": "m5", "q": "Si varios superiores con atribuciones disciplinarias presencian una falta leve, ¿quién decide la sanción directa?", "o": ["El de mayor grado o, en su defecto, el de mayor antigüedad", "El que primero la vio", "El jefe de la dependencia del infractor", "El de menor grado"], "e": "Regla de competencia de la Res. 2372/23.", "p": 247}, {"id": "m5-61", "m": "m5", "q": "El recurso contra una sanción directa debe interponerse dentro de:", "o": ["3 días", "5 días", "10 días", "24 horas"], "e": "Tiene efecto devolutivo: la sanción se ejecuta aun con el recurso en trámite.", "p": 248}, {"id": "m5-62", "m": "m5", "q": "¿Cuáles son las sanciones de corrección según la Ley 12.521?", "o": ["Reconvención escrita, apercibimiento simple y apercibimiento agravado", "Suspensión provisional y suspensión de empleo", "Destitución y cesantía", "Arresto y multa"], "e": "Suspensión: provisional y de empleo. Extinción: destitución.", "p": 248}, {"id": "m5-63", "m": "m5", "q": "La destitución solo puede disponerse por:", "o": ["Decreto del Poder Ejecutivo", "Resolución del Jefe de Policía", "Resolución del Jefe de Unidad Regional", "Sentencia penal"], "e": "Importa el cese del empleo público y la pérdida del estado policial.", "p": 249}, {"id": "m5-64", "m": "m5", "q": "¿Qué sanción NO admite pena alternativa?", "o": ["Apercibimiento agravado", "Reconvención", "Apercibimiento simple", "Todas la admiten"], "e": "Reconvención: 4 a 16 h; apercibimiento simple: 16 a 24 h; el agravado no admite alternativa.", "p": 249}, {"id": "m5-65", "m": "m5", "q": "Los topes de la pena alternativa son de:", "o": ["4 horas por día y 8 horas por semana, a ejecutarse dentro de 30 días", "8 horas por día y 40 por semana", "2 horas por día y 10 por semana", "Sin topes"], "e": "No remunerada y fuera del horario de servicio.", "p": 249}, {"id": "m5-66", "m": "m5", "q": "El recurso ordinario contra una corrección por falta leve tiene un plazo de 3 días hábiles. ¿Y la apelación posterior?", "o": ["5 días hábiles desde la notificación de la resolución del recurso ordinario", "3 días hábiles", "10 días hábiles", "24 horas"], "e": "Ambos se resuelven en 10 días hábiles y tienen efecto devolutivo.", "p": 250}, {"id": "m5-67", "m": "m5", "q": "En sanciones por faltas graves (RSA), la reconsideración debe interponerse dentro de:", "o": ["3 días hábiles desde la notificación", "5 días hábiles", "10 días hábiles", "15 días corridos"], "e": "La resuelve la misma autoridad que dictó el acto; la apelación es en 5 días hábiles.", "p": 251}, {"id": "m5-68", "m": "m5", "q": "La disponibilidad, a diferencia de la suspensión provisional:", "o": ["No se rige por el límite de 12 horas, sino que es temporal y sujeta a la necesidad del servicio", "Es una sanción disciplinaria", "Dura siempre 30 días", "Solo la dispone el Poder Ejecutivo"], "e": "Busca preservar la investigación o evitar riesgos, con revisión periódica para no ser sanción encubierta.", "p": 249}, {"id": "m6-0", "m": "m6", "q": "¿Cuál es la primera medida de seguridad básica y obligatoria con armas de fuego?", "o": ["Considerar SIEMPRE el arma como si estuviese cargada, aunque sepamos que no lo está", "Llevar siempre cartucho en recámara", "Limpiar el arma delante de un compañero", "Colocar el dedo sobre la cola del disparador al empuñar"], "e": "Es la medida número 1 de las diez medidas básicas y obligatorias.", "p": 255}, {"id": "m6-1", "m": "m6", "q": "Al empuñar un arma de fuego, el dedo índice debe:", "o": ["Permanecer estirado y en paralelo al armazón, nunca sobre la cola del disparador", "Apoyarse sobre la cola del disparador", "Ubicarse dentro del guardamonte", "Apoyarse en la corredera"], "e": "Solo se coloca en el disparador cuando el instructor habilita con la orden «fuego libre».", "p": 255}, {"id": "m6-2", "m": "m6", "q": "¿Cómo debe verificarse un arma al empuñarla?", "o": ["De manera mecánica, visual y táctil, previo haber quitado el cargador o removido los cartuchos", "Solo visualmente", "Disparando al aire", "Agitándola para escuchar si tiene cartuchos"], "e": "Medida básica número 2.", "p": 255}, {"id": "m6-3", "m": "m6", "q": "En caso de tener que entregar el arma provista (por ej., en un relevo de guardia), debe entregarse:", "o": ["Sin cargador, despejada y abierta", "Cargada y con seguro", "Con el cargador colocado y sin cartucho en recámara", "En su funda, sin verificar"], "e": "Solo se entrega en los casos justificados que enumera el material.", "p": 255}, {"id": "m6-4", "m": "m6", "q": "Durante el traslado (fuera de servicio), un arma de fuego se transporta:", "o": ["En su funda, caja o portafolio, descargada, con el cargador separado y sin cartuchos", "Adosada al cuerpo, descargada", "Cargada y con seguro", "En la guantera del vehículo"], "e": "Por ningún motivo se la llevará adosada al cuerpo, aunque esté descargada.", "p": 253}, {"id": "m6-5", "m": "m6", "q": "En el polígono, desde la armería hasta la barrera de tiro, las pistolas deben llevarse:", "o": ["Con la corredera abierta y los cargadores sin cartuchos", "Cargadas y aseguradas", "Con cartucho en recámara", "Enfundadas y cargadas"], "e": "Los revólveres con el tambor volcado; las pistolas con la corredera abierta.", "p": 254}, {"id": "m6-6", "m": "m6", "q": "Según el material, el proyectil de una carabina calibre 22 LR puede recorrer hasta:", "o": ["2 km", "500 m", "10 km", "200 m"], "e": "El de un fusil puede superar los 5 km y las postas pueden recorrer 600 m.", "p": 254}, {"id": "m6-7", "m": "m6", "q": "Luego de verificar el arma en el polígono, el operador debe repetir a viva voz:", "o": ["«Arma despejada y segura»", "«Fuego libre»", "«Línea segura»", "«Alto el fuego»"], "e": "«Fuego libre», «alto el fuego» y «línea segura» son órdenes del instructor.", "p": 256}, {"id": "m6-8", "m": "m6", "q": "Si se produce una traba del arma durante la práctica de tiro, el tirador debe:", "o": ["Decir a viva voz «arma trabada», levantar la mano inhábil, mantener el arma hacia el blanco y esperar al instructor", "Girarse hacia el instructor con el arma para mostrarla", "Intentar destrabarla solo y seguir disparando", "Dejar el arma en el suelo y retirarse"], "e": "El cañón permanece dirigido hacia el blanco o espaldón.", "p": 256}, {"id": "m6-9", "m": "m6", "q": "Al finalizar la práctica, los tiradores pueden avanzar a recolectar vainas cuando:", "o": ["El instructor verifica e indica a viva voz «línea segura»", "Terminan de disparar todos los cartuchos", "El compañero termina de disparar", "Escuchan «alto el fuego»"], "e": "Hasta entonces deben permanecer en la línea.", "p": 256}, {"id": "m6-10", "m": "m6", "q": "En el patrullero, la verificación del arma antes o después de una acción operativa es recomendable que se realice:", "o": ["En binomio", "En soledad", "Delante de civiles", "Con el detenido presente"], "e": "El personal está bajo estrés situacional, por eso se recomienda en binomio.", "p": 258}, {"id": "m6-11", "m": "m6", "q": "¿Cuál es una regla sobre detenidos en el móvil policial?", "o": ["Jamás subir un detenido al móvil sin el chequeo personal correspondiente; siempre esposado y con puertas bloqueadas", "Llevarlo preferentemente en la caja de la camioneta", "Sentarlo junto al arma larga", "Puede viajar sin esposas si colabora"], "e": "Debe haber separación física entre armas, personal y detenidos.", "p": 258}, {"id": "m6-12", "m": "m6", "q": "¿Cuál es un beneficio del entrenamiento en seco?", "o": ["Construye memoria muscular y elimina el riesgo de accidentes", "Aumenta el consumo de munición", "Reemplaza totalmente la práctica con fuego real", "Desgasta más rápido el arma"], "e": "También reduce el consumo de munición y el desgaste del arma.", "p": 259}, {"id": "m6-13", "m": "m6", "q": "La pistola Bersa Thunder Pro tiene una capacidad de carga de:", "o": ["17 cartuchos en el cargador, más uno en la recámara", "15 cartuchos, más uno en la recámara", "13 cartuchos, sin cartucho en recámara", "20 cartuchos en total"], "e": "Es semiautomática, de doble acción y ambidiestra.", "p": 260}, {"id": "m6-14", "m": "m6", "q": "¿Cuáles son los dos dispositivos de seguridad de la pistola Bersa Thunder Pro?", "o": ["Seguro automático de aguja percutora y seguro de corredera", "Seguro de empuñadura y seguro de cargador", "Seguro integral y seguro de martillo", "Seguro de disparador y seguro de gatillo"], "e": "El seguro integral de funcionamiento corresponde a la Bersa Ultra Compact Pro.", "p": 261}, {"id": "m6-15", "m": "m6", "q": "En la Bersa Thunder Pro, el seguro de corredera se activa:", "o": ["Al subir la palanca", "Al bajar la palanca", "Al presionar la cola del disparador", "Al quitar el cargador"], "e": "Bloquea la corredera y desactiva el mecanismo de disparo.", "p": 261}, {"id": "m6-16", "m": "m6", "q": "Después de usar la palanca de desmartillado de la Bersa, es importante:", "o": ["Bajarla nuevamente, porque funciona también como seguro de corredera", "Dejarla arriba para que dispare", "Quitar el cargador", "Accionar la corredera dos veces"], "e": "Si no se baja, el arma permanece asegurada imposibilitando el disparo.", "p": 262}, {"id": "m6-17", "m": "m6", "q": "El primer paso del desarme de campaña de la pistola es:", "o": ["Quitar el cargador y verificar que no haya cartucho en la recámara", "Bajar la palanca de desarme", "Retirar el resorte recuperador", "Deslizar la corredera hacia adelante"], "e": "Recaudo de seguridad inicial antes de cualquier desarme.", "p": 263}, {"id": "m6-18", "m": "m6", "q": "¿En cuántas posiciones se ejecuta la técnica del desenfunde?", "o": ["4", "3", "5", "2"], "e": "Posición 1: empuñe; 2: a la altura de la cintura; 3: a la altura del pecho; 4: brazos extendidos.", "p": 266}, {"id": "m6-19", "m": "m6", "q": "En la posición de tiro isósceles modificado, para un tirador diestro:", "o": ["El pie izquierdo queda más adelantado y las rodillas ligeramente flexionadas", "Los pies quedan paralelos a la altura de los hombros", "La rodilla hábil apoya en el suelo", "El pie derecho queda más adelantado"], "e": "Se resguarda el lado fuerte (donde está la pistolera).", "p": 268}, {"id": "m6-20", "m": "m6", "q": "La balística que estudia el proyectil desde que abandona la boca del cañón hasta que impacta en el blanco es la:", "o": ["Balística exterior", "Balística interior", "Balística terminal", "Balística forense"], "e": "Interior: dentro del arma; exterior: en vuelo; terminal o de efectos: en el blanco.", "p": 270}, {"id": "m6-21", "m": "m6", "q": "El «tatuaje» alrededor del orificio de entrada es:", "o": ["El conjunto de gránulos de pólvora que no se borran por lavado ni frotado", "El humo de la combustión que se borra con lavado", "El orificio de salida", "La marca del estriado en la bala"], "e": "El ahumamiento, en cambio, se borra con lavado.", "p": 270}, {"id": "m6-22", "m": "m6", "q": "El calibre de un arma de fuego es:", "o": ["El diámetro interno del ánima del cañón", "El largo del cañón", "El peso del proyectil", "La capacidad del cargador"], "e": "Puede medirse como calibre real o nominal.", "p": 270}, {"id": "m6-23", "m": "m6", "q": "En las escopetas, el calibre 12 significa que:", "o": ["Con una libra inglesa de plomo se obtenían 12 balas esféricas del diámetro del ánima", "El cañón mide 12 milímetros", "Dispara 12 perdigones", "El cartucho mide 12 centímetros"], "e": "Es un calibre nominal, el más antiguo, de la época de las armas de avancarga.", "p": 271}, {"id": "m6-24", "m": "m6", "q": "El cartucho o tiro está compuesto por:", "o": ["Proyectil, carga de proyección, cápsula fulminante y vaina", "Cañón, recámara y corredera", "Pólvora y martillo", "Ojiva, cargador y percutor"], "e": "Definición del art. 3° inc. 19 del Decr
